<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a tactical board. Match readout strip on top, map rail under it,
   then two shelves (Smokes, Flashes) that each hold one page of three lineup slots. */
:root {
  color-scheme: dark;            /* single dark world by choice: it sits next to the game */
  --ground: #15120e;             /* shadowed sandstone */
  --panel: #1f1a14;
  --panel-2: #2a231b;
  --line: #3b3226;
  --text: #efe5d3;
  --muted: #a8997f;
  --t: #e6a23c;                  /* Terrorist ochre */
  --ct: #79aee0;                 /* Counter-Terrorist steel blue */
  --live: #e5534b;
  --on-accent: #17130e;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-12: 0.75rem; --s-14: 0.875rem; --s-16: 1rem; --s-20: 1.25rem; --s-28: 1.75rem; --s-48: 3rem;
  --radius: 6px;
}
.app { --accent: var(--t); --accent-soft: rgba(230, 162, 60, 0.14); }
.app[data-side="CT"] { --accent: var(--ct); --accent-soft: rgba(121, 174, 224, 0.14); }

* { box-sizing: border-box; }
html, body { background: var(--ground); }
body {
  margin: 0; color: var(--text); font-family: var(--font-body); font-size: var(--s-14); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; display: grid; gap: 20px; }

/* ---------- match strip ---------- */
.strip {
  display: grid; grid-template-columns: 1fr auto; gap: 16px 24px; align-items: end;
  padding-bottom: 18px; border-bottom: 1px solid var(--line);
}
.brand {
  grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-family: var(--font-display); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  font-size: var(--s-14); color: var(--muted);
}
.brand b { color: var(--text); font-weight: 700; }
.readout { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; min-width: 0; }
.map-title { display: grid; gap: 2px; min-width: 0; }
.map-title h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
  font-size: clamp(2.25rem, 6vw, var(--s-48)); line-height: 0.95; letter-spacing: 0.02em; text-wrap: balance;
}
.map-title .code { color: var(--muted); font-size: var(--s-12); }

.sides { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.sides button {
  border: 0; background: transparent; cursor: pointer; padding: 8px 16px; min-width: 56px;
  font-family: var(--font-display); font-weight: 700; font-size: var(--s-20); letter-spacing: 0.06em; color: var(--muted);
}
.sides button[data-side="T"][aria-pressed="true"] { background: var(--t); color: var(--on-accent); }
.sides button[data-side="CT"][aria-pressed="true"] { background: var(--ct); color: var(--on-accent); }
.sides button:not([aria-pressed="true"]):hover { color: var(--text); background: var(--panel-2); }

.matchline { color: var(--muted); font-size: var(--s-12); padding-bottom: 6px; }
.matchline strong { color: var(--text); font-weight: 500; }

.live { display: grid; justify-items: end; gap: 6px; text-align: right; }
.live-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); font-size: var(--s-12); font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.live-chip[data-state="live"] { border-color: rgba(229, 83, 75, 0.5); }
.live-chip[data-state="live"] .dot { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
.live-chip[data-state="waiting"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
@keyframes pulse { 50% { opacity: 0.35; } }
.live-note { color: var(--muted); font-size: var(--s-12); max-width: 34ch; }
.live-note a, .live-note button.linkish { color: var(--text); }
button.linkish { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font-size: inherit; }

[hidden] { display: none !important; }
img { max-width: 100%; }

/* ---------- map rail + slideshow controls ---------- */
.railrow { display: flex; gap: 12px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.maps { display: flex; gap: 8px; flex-wrap: wrap; }
.play { display: inline-flex; align-items: center; gap: 8px; }
.play-label { color: var(--muted); font-size: var(--s-12); text-transform: uppercase; letter-spacing: 0.08em; }
.play-btn, .speeds button {
  border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: var(--s-12); color: var(--muted); padding: 6px 10px;
}
.play-btn { border-radius: var(--radius); color: var(--text); min-width: 76px; }
.play-btn:hover { border-color: var(--accent); }
.speeds { display: inline-flex; }
.speeds button { border-radius: 0; margin-left: -1px; }
.speeds button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
.speeds button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.speeds button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); position: relative; }
.speeds button:not([aria-pressed="true"]):hover { color: var(--text); }
.maps button {
  display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer;
  padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: transparent;
  font-family: var(--font-display); font-weight: 600; font-size: var(--s-16); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
}
.maps button .n { font-family: var(--font-mono); font-size: var(--s-12); font-weight: 400; }
.maps button:hover { color: var(--text); border-color: var(--muted); }
.maps button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.maps button[data-empty="true"]:not([aria-pressed="true"]) { opacity: 0.55; }

/* ---------- shelves ---------- */
.shelf { display: grid; gap: 12px; }
.shelf-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.shelf-head h2 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: var(--s-28);
  text-transform: uppercase; letter-spacing: 0.04em; line-height: 1;
}
.kind-mark { width: 12px; height: 12px; border-radius: 2px; background: var(--accent); flex: none; }
.shelf[data-type="flash"] .kind-mark { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); border-radius: 50%; }
.shelf-head .count { color: var(--muted); font-size: var(--s-12); text-transform: uppercase; letter-spacing: 0.08em; }
.pager { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
.pager span { color: var(--muted); font-size: var(--s-12); min-width: 9ch; text-align: center; }
.pager button {
  width: 34px; height: 34px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel);
  cursor: pointer; font-size: var(--s-20); line-height: 1; display: grid; place-items: center;
}
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager button:disabled { opacity: 0.35; cursor: default; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.shot { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #0d0b08; }
.shot button { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
.shot button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.35s ease; }
.shot img.fading { opacity: 0.15; }
.shot-label {
  position: absolute; left: 8px; top: 8px; padding: 2px 7px; border-radius: 3px;
  background: rgba(13, 11, 8, 0.82); color: var(--text); font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase;
  pointer-events: none;
}
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.tabs button {
  flex: 1 1 0; min-width: 0; border: 0; background: transparent; cursor: pointer; padding: 7px 4px;
  font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs button { position: relative; }
/* Slideshow: the bar under the active tab fills over --dur; when it ends the card advances. */
.tabs .bar { position: absolute; left: 0; bottom: -2px; height: 2px; width: 0; background: var(--accent); pointer-events: none; }
.card[data-playing="true"] .tabs button[aria-selected="true"] { border-bottom-color: var(--line); }
/* Stills mode: a CSS animation is the timer. Clip mode: the video drives the bar width from JS. */
.card[data-mode="stills"][data-playing="true"] .tabs button[aria-selected="true"] .bar { animation: fill var(--dur, 2.5s) linear forwards; }
.card[data-mode="stills"]:hover .bar, .card[data-mode="stills"]:focus-within .bar, .app.lb-open .bar { animation-play-state: paused !important; }
.shot video { width: 100%; height: 100%; object-fit: cover; display: block; background: #0d0b08; }
@keyframes fill { from { width: 0; } to { width: 100%; } }
.tabs .k { font-family: var(--font-mono); margin-right: 4px; opacity: 0.7; }

.card-body { display: grid; gap: 10px; padding: 14px 14px 12px; flex: 1; align-content: start; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: var(--s-20); letter-spacing: 0.02em; line-height: 1.15; text-wrap: balance; }
.route { margin: 0; color: var(--muted); font-size: var(--s-12); text-transform: uppercase; letter-spacing: 0.08em; }
.route .arrow { color: var(--accent); margin: 0 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 2px 8px; border-radius: 3px; border: 1px solid var(--line); font-size: var(--s-12); color: var(--text); background: var(--ground);
}
.chip.mono { color: var(--accent); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; counter-increment: step; }
.steps li::before {
  content: counter(step); font-family: var(--font-mono); font-size: var(--s-12); color: var(--accent);
  border: 1px solid var(--line); border-radius: 3px; height: 20px; display: grid; place-items: center; margin-top: 1px;
}
.note { margin: 0; color: var(--muted); font-size: var(--s-12); border-left: 2px solid var(--line); padding-left: 10px; }
.card-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 10px 14px; border-top: 1px solid var(--line); font-size: var(--s-12); color: var(--muted);
}
.card-foot a { color: var(--text); text-decoration: none; display: inline-flex; gap: 6px; align-items: baseline; }
.card-foot a:hover { color: var(--accent); }
.card-foot a .mono { color: var(--accent); }

.slot {
  display: grid; place-content: center; text-align: center; gap: 6px; min-height: 220px; padding: 20px;
  border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); font-size: var(--s-12);
}
.slot strong { font-family: var(--font-display); font-size: var(--s-16); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); font-weight: 600; }

.banner {
  display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--muted);
}
.banner strong { color: var(--text); }

.source { color: var(--muted); font-size: var(--s-12); border-top: 1px solid var(--line); padding-top: 14px; }
.source a { color: var(--text); }

/* ---------- lightbox ---------- */
dialog.lightbox {
  width: min(1280px, 100vw - 32px); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line);
  border-radius: var(--radius); background: #0d0b08; color: var(--text);
}
dialog.lightbox::backdrop { background: rgba(8, 7, 5, 0.86); }
.lb-img { display: block; width: 100%; height: auto; max-height: calc(100vh - 110px); object-fit: contain; }
.lb-video { display: block; width: 100%; max-height: calc(100vh - 110px); background: #000; }
.lb-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.lb-bar .lb-title { font-family: var(--font-display); font-weight: 700; font-size: var(--s-16); letter-spacing: 0.04em; text-transform: uppercase; }
.lb-bar .lb-step { color: var(--muted); font-size: var(--s-12); text-transform: uppercase; letter-spacing: 0.08em; }
.lb-bar .spacer { flex: 1; }
.lb-bar button {
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font-size: var(--s-12);
}
.lb-bar button:hover { border-color: var(--accent); }

@media (max-width: 960px) {
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-rows: auto auto 1fr; }
  .card .shot { grid-column: 1; grid-row: 1; }
  .card .tabs { grid-column: 1; grid-row: 2; }
  .card .card-body { grid-column: 2; grid-row: 1 / 3; }
  .card .card-foot { grid-column: 1 / -1; grid-row: 3; align-self: end; }
  .slot { min-height: 120px; }
}
@media (max-width: 640px) {
  .app { padding-inline: 16px; }
  .strip { grid-template-columns: 1fr; }
  .live { justify-items: start; text-align: left; }
  .card { display: flex; }
  .pager { margin-left: 0; width: 100%; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) {
  .live-chip[data-state="live"] .dot { animation: none; }
}
</style>

<div class="app" id="app" data-side="T">
  <header class="strip">
    <div class="brand"><span><b>Nade Book</b> · smokes &amp; flashes</span><span class="mono" id="steamName"></span></div>
    <div class="readout">
      <div class="map-title">
        <h1 id="mapName">Mirage</h1>
        <span class="code mono" id="mapCode">de_mirage</span>
      </div>
      <div class="sides" role="group" aria-label="Side">
        <button type="button" id="sideT" data-side="T" aria-pressed="true">T</button>
        <button type="button" id="sideCT" data-side="CT" aria-pressed="false">CT</button>
      </div>
      <div class="matchline mono" id="matchline" hidden></div>
    </div>
    <div class="live" id="liveBox" hidden>
      <span class="live-chip" id="liveChip" data-state="manual"><span class="dot"></span><span id="liveText">Manual pick</span></span>
      <span class="live-note" id="liveNote"></span>
    </div>
  </header>

  <div class="railrow">
    <nav class="maps" id="maps" aria-label="Map"></nav>
    <div class="play" role="group" aria-label="Shot slideshow">
      <span class="play-label">Shots</span>
      <button type="button" class="play-btn" id="playBtn" aria-pressed="true">❚❚ Pause</button>
      <div class="speeds" role="group" aria-label="Slideshow speed">
        <button type="button" id="speed-slow" data-speed="slow" aria-pressed="false">Slow</button>
        <button type="button" id="speed-med" data-speed="med" aria-pressed="true">Med</button>
        <button type="button" id="speed-fast" data-speed="fast" aria-pressed="false">Fast</button>
      </div>
    </div>
  </div>

  <div class="banner" id="mapBanner" hidden></div>

  <section class="shelf" data-type="smoke" id="shelf-smoke" aria-labelledby="h-smoke">
    <div class="shelf-head">
      <span class="kind-mark" aria-hidden="true"></span>
      <h2 id="h-smoke">Smokes</h2>
      <span class="count" id="count-smoke"></span>
      <div class="pager">
        <button type="button" id="prev-smoke" aria-label="Previous smokes">‹</button>
        <span class="mono" id="range-smoke" aria-live="polite"></span>
        <button type="button" id="next-smoke" aria-label="Next smokes">›</button>
      </div>
    </div>
    <div class="cards" id="cards-smoke"></div>
  </section>

  <section class="shelf" data-type="flash" id="shelf-flash" aria-labelledby="h-flash">
    <div class="shelf-head">
      <span class="kind-mark" aria-hidden="true"></span>
      <h2 id="h-flash">Flashes</h2>
      <span class="count" id="count-flash"></span>
      <div class="pager">
        <button type="button" id="prev-flash" aria-label="Previous flashes">‹</button>
        <span class="mono" id="range-flash" aria-live="polite"></span>
        <button type="button" id="next-flash" aria-label="Next flashes">›</button>
      </div>
    </div>
    <div class="cards" id="cards-flash"></div>
  </section>

  <p class="source" id="sourceLine"></p>
</div>

<dialog class="lightbox" id="lightbox" aria-label="Lineup screenshot">
  <img class="lb-img" id="lbImg" alt="">
  <video class="lb-video" id="lbVideo" controls muted playsinline loop hidden></video>
  <div class="lb-bar">
    <span class="lb-title" id="lbTitle"></span>
    <span class="lb-step" id="lbStep"></span>
    <span class="spacer"></span>
    <button type="button" id="lbPrev">‹ Prev</button>
    <button type="button" id="lbNext">Next ›</button>
    <button type="button" id="lbClose">Close</button>
  </div>
</dialog>

    {"id": "anubis-heaven-smoke", "map": "anubis", "side": "T", "type": "smoke", "src": "anubis-tg1", "t": 456, "title": "Heaven smoke", "from": "Canal", "to": "Heaven", "chips": ["Jump-throw"], "steps": ["Drop into the Canal water and tuck into the corner of the pool (Stand).", "Turn around and aim right between the two brackets on the box under the A sign (Aim).", "Jump-throw. It bounces off the back wall and covers Heaven (Result)."], "note": "A simple Heaven smoke with no gaps in it. The A site pop flash below is thrown from the same corner.", "shots": [["Stand", "img/anubis/heaven-smoke-stand.jpg"], ["Aim", "img/anubis/heaven-smoke-aim.jpg"], ["Result", "img/anubis/heaven-smoke-result.jpg"]], "order": 25, "clip": {"file": "clips/anubis/heaven-smoke.mp4", "cues": [0.5, 3.5, 12.0]}},
    {"id": "anubis-camera-smoke", "map": "anubis", "side": "T", "type": "smoke", "src": "anubis-tg1", "t": 424, "title": "Camera smoke", "from": "Rugs (T Side Upper)", "to": "Camera", "chips": ["Left-click"], "steps": ["On Rugs, walk over to the orange wall and tuck into its edge (Stand).", "Find the corner of the Camera window, then raise your aim until it meets the arch (Aim).", "Left-click throw. The smoke flies through and fills Camera (Result)."], "note": "Tigerr calls this one of the two most important A smokes. If you can see the corner of the doorway, you are lined up right.", "shots": [["Stand", "img/anubis/camera-smoke-stand.jpg"], ["Aim", "img/anubis/camera-smoke-aim.jpg"], ["Result", "img/anubis/camera-smoke-result.jpg"]], "order": 26, "clip": {"file": "clips/anubis/camera-smoke.mp4", "cues": [0.5, 2.0, 14.5]}},
    {"id": "anubis-b-right-smoke", "map": "anubis", "side": "T", "type": "smoke", "src": "anubis-tg1", "t": 262, "title": "B site right smoke", "from": "Outside Long", "to": "B site, right side", "chips": ["Jump-throw"], "steps": ["Coming out toward B, move left and stand in the middle of the bend by the arched grate (Stand).", "Find the first crest on the temple wall and aim at the very top of its right corner (Aim).", "Jump-throw. It lands in front of the small stone on the right side of B (Result)."], "note": "Blocks the right side of B with no vision over it. Throw it with the left side smoke from the same spot.", "shots": [["Stand", "img/anubis/b-right-smoke-stand.jpg"], ["Aim", "img/anubis/b-right-smoke-aim.jpg"], ["Result", "img/anubis/b-right-smoke-result.jpg"]], "order": 27, "clip": {"file": "clips/anubis/b-right-smoke.mp4", "cues": [0.5, 3.0, 8.5]}},
    {"id": "anubis-b-left-smoke", "map": "anubis", "side": "T", "type": "smoke", "src": "anubis-tg1", "t": 296, "title": "B site left smoke", "from": "Outside Long", "to": "B site, left side", "chips": ["Jump-throw"], "steps": ["Use the same spot in the middle of the bend by the arched grate (Stand).", "Move your aim right to the bottom of the second crest on the temple wall (Aim).", "Jump-throw. It bounces off the small roof and lands on the left side of B (Result)."], "note": "With both B smokes up, Tigerr says the only spot left to worry about is E-box.", "shots": [["Stand", "img/anubis/b-left-smoke-stand.jpg"], ["Aim", "img/anubis/b-left-smoke-aim.jpg"], ["Result", "img/anubis/b-left-smoke-result.jpg"]], "order": 28, "clip": {"file": "clips/anubis/b-left-smoke.mp4", "cues": [0.5, 2.5, 14.5]}},
    {"id": "anubis-mid-spawn-smoke", "map": "anubis", "side": "T", "type": "smoke", "src": "anubis-cn1", "t": 58, "title": "Mid smoke from spawn", "from": "T spawn", "to": "Mid doors", "chips": ["Jump-throw"], "steps": ["Stand next to the parked truck in T spawn (Stand).", "Aim just left of the small window on the back building, above the little palm (Aim).", "Jump-throw. The smoke drops into the mid doors (Result)."], "note": "Smokes the mid doors straight from spawn, so you can take mid early.", "shots": [["Stand", "img/anubis/mid-spawn-smoke-stand.jpg"], ["Aim", "img/anubis/mid-spawn-smoke-aim.jpg"], ["Result", "img/anubis/mid-spawn-smoke-result.jpg"]], "order": 29, "clip": {"file": "clips/anubis/mid-spawn-smoke.mp4", "cues": [0.4, 3.4, 13.7]}},
    {"id": "anubis-b-site-double-smoke", "map": "anubis", "side": "T", "type": "smoke", "src": "anubis-cn1", "t": 155, "title": "B site double smoke", "from": "Stairs before B", "to": "B site", "chips": ["Left-click"], "steps": ["Stand on the stairs in the narrow passage that leads to B (Stand).", "Aim at the top left of the second gap on the temple wall and left-click throw (Aim).", "Move your aim right, above the gap next to the hanging vines, and left-click throw again (Detail).", "Both smokes land on B site next to the red B (Result)."], "note": "Two smokes from one spot that wall off B site for an entry.", "shots": [["Stand", "img/anubis/b-site-double-smoke-stand.jpg"], ["Aim", "img/anubis/b-site-double-smoke-aim.jpg"], ["Detail", "img/anubis/b-site-double-smoke-detail.jpg"], ["Result", "img/anubis/b-site-double-smoke-result.jpg"]], "order": 30, "clip": {"file": "clips/anubis/b-site-double-smoke.mp4", "cues": [0.5, 2.0, 5.5, 13.5]}},
    {"id": "anubis-dark-smoke", "map": "anubis", "side": "T", "type": "smoke", "src": "anubis-fn1", "t": 168, "title": "Dark smoke", "from": "Near the green cross sign", "to": "Dark", "chips": ["Jump-throw"], "steps": ["Stand in the open street facing the building with the green cross sign (Stand).", "Aim at the left edge of the tall building, just right of the scaffolding (Aim).", "Jump-throw. The smoke fills the doorway next to the notice board (Result)."], "note": "FNScence uses this on the way to B and follows it with a molotov into the same doorway.", "shots": [["Stand", "img/anubis/dark-smoke-stand.jpg"], ["Aim", "img/anubis/dark-smoke-aim.jpg"], ["Result", "img/anubis/dark-smoke-result.jpg"]], "order": 31, "clip": {"file": "clips/anubis/dark-smoke.mp4", "cues": [0.5, 1.6, 10.1]}},
    {"id": "anubis-a-site-pop-flash", "map": "anubis", "side": "T", "type": "flash", "src": "anubis-tg1", "t": 484, "title": "A site pop flash", "from": "Canal", "to": "A site", "chips": ["Left-click"], "steps": ["Use the Heaven smoke corner in the Canal water (Stand).", "Aim up at the small L-shaped sign and put your crosshair on its bottom left (Aim).", "Left-click throw. It pops over A and blinds players on Walkway, Heaven and Plat (Result)."], "note": "Team safe because it pops behind the wall, so you can swing as soon as it is thrown. It does not hit a player on close pillar.", "shots": [["Stand", "img/anubis/a-site-pop-flash-stand.jpg"], ["Aim", "img/anubis/a-site-pop-flash-aim.jpg"], ["Result", "img/anubis/a-site-pop-flash-result.jpg"]], "order": 32, "clip": {"file": "clips/anubis/a-site-pop-flash.mp4", "cues": [0.5, 3.0, 9.4]}},
    {"id": "anubis-b-site-pop-flash", "map": "anubis", "side": "T", "type": "flash", "src": "anubis-tg1", "t": 352, "title": "B site pop flash", "from": "Outside Long", "to": "B site", "chips": ["Jump-throw"], "steps": ["Use the same bend spot as the B site smokes (Stand).", "Go right to the second half circle on the temple wall and aim at its very bottom (Aim).", "The inset shows where you stand. Jump-throw (Detail).", "It bounces off the wall and scaffolding and pops over the site (Result)."], "note": "Hits everything you can see at B. Very strong against players on Pizza, who only see it for a split second.", "shots": [["Stand", "img/anubis/b-site-pop-flash-stand.jpg"], ["Aim", "img/anubis/b-site-pop-flash-aim.jpg"], ["Detail", "img/anubis/b-site-pop-flash-detail.jpg"], ["Result", "img/anubis/b-site-pop-flash-result.jpg"]], "order": 33, "clip": {"file": "clips/anubis/b-site-pop-flash.mp4", "cues": [0.5, 2.5, 5.5, 11.8]}},
    {"id": "anubis-a-god-flash", "map": "anubis", "side": "T", "type": "flash", "src": "anubis-fn1", "t": 69, "title": "A GOD flash", "from": "Canal", "to": "A site", "chips": ["W + jump-throw"], "steps": ["Stand at the spot shown in the inset, across the water from the A sign (Stand).", "Aim at the stone wall left of the wicker pots, about halfway up (Aim).", "From standing, press W and jump-throw. Defenders on A get blinded (Result)."], "note": "FNScence calls this the A GOD flash. It flies over A site and catches players holding the site.", "shots": [["Stand", "img/anubis/a-god-flash-stand.jpg"], ["Aim", "img/anubis/a-god-flash-aim.jpg"], ["Result", "img/anubis/a-god-flash-result.jpg"]], "order": 34, "clip": {"file": "clips/anubis/a-god-flash.mp4", "cues": [0.4, 2.0, 8.9]}},
    {"id": "anubis-mid-doors-flash", "map": "anubis", "side": "T", "type": "flash", "src": "anubis-fn1", "t": 107, "title": "Mid doors flash", "from": "Mid", "to": "Mid doors", "chips": ["Running jump-throw"], "steps": ["Start from the spot shown in the inset, by the arched gate (Stand).", "Aim into the gap between the buildings, at the corner of the far wall (Aim).", "Run forward and jump-throw (Detail).", "It pops through mid doors and blinds the player holding them (Result)."], "note": "Use it to take mid doors when a CT is holding them from the other side.", "shots": [["Stand", "img/anubis/mid-doors-flash-stand.jpg"], ["Aim", "img/anubis/mid-doors-flash-aim.jpg"], ["Detail", "img/anubis/mid-doors-flash-detail.jpg"], ["Result", "img/anubis/mid-doors-flash-result.jpg"]], "order": 35, "clip": {"file": "clips/anubis/mid-doors-flash.mp4", "cues": [0.4, 1.6, 3.4, 9.0]}},
    {"id": "anubis-water-stairs-smoke", "map": "anubis", "side": "CT", "type": "smoke", "src": "anubis-cn1", "t": 124, "title": "Water stairs smoke", "from": "CT spawn", "to": "Water stairs", "chips": ["Jump-throw"], "steps": ["Stand behind the low stone block in CT spawn, with the sea in front of you (Stand).", "Turn to the building with the flowers and aim at the top corner of the carved ledge (Aim).", "Jump-throw. It lands at the foot of the stairs by the wooden walkway (Result)."], "note": "A fast smoke on the stairs out of the water. Pros use it early in the round so CTs can take water control.", "shots": [["Stand", "img/anubis/water-stairs-smoke-stand.jpg"], ["Aim", "img/anubis/water-stairs-smoke-aim.jpg"], ["Result", "img/anubis/water-stairs-smoke-result.jpg"]], "order": 36, "clip": {"file": "clips/anubis/water-stairs-smoke.mp4", "cues": [0.4, 3.4, 13.8]}},
    {"id": "anubis-a-main-smoke", "map": "anubis", "side": "CT", "type": "smoke", "src": "anubis-fn1", "t": 339, "title": "A main smoke", "from": "A site", "to": "A main", "chips": ["Standing throw"], "steps": ["Stand against the door with the yellow frame (Stand).", "Look up and aim at the sky just left of the roof edge (Aim).", "The inset shows the exact spot. Throw while standing still (Detail).", "The smoke lands on the water in front of A main (Result)."], "note": "Blocks the exit from A main onto the water to slow down a T push.", "shots": [["Stand", "img/anubis/a-main-smoke-stand.jpg"], ["Aim", "img/anubis/a-main-smoke-aim.jpg"], ["Detail", "img/anubis/a-main-smoke-detail.jpg"], ["Result", "img/anubis/a-main-smoke-result.jpg"]], "order": 37, "clip": {"file": "clips/anubis/a-main-smoke.mp4", "cues": [0.5, 3.2, 4.5, 5.6]}},
    {"id": "anubis-b-main-lurk-smoke", "map": "anubis", "side": "CT", "type": "smoke", "src": "anubis-fn1", "t": 418, "title": "B main smoke", "from": "B site", "to": "B main", "chips": ["Running throw"], "steps": ["Start from the spot in the inset, next to the pillars at B (Stand).", "Aim at the bottom of the far doorway as shown (Aim).", "Run and throw. The smoke covers B main (Result)."], "note": "FNScence labels it the B main lurk smoke. It cuts B main off from the site.", "shots": [["Stand", "img/anubis/b-main-lurk-smoke-stand.jpg"], ["Aim", "img/anubis/b-main-lurk-smoke-aim.jpg"], ["Result", "img/anubis/b-main-lurk-smoke-result.jpg"]], "order": 38, "clip": {"file": "clips/anubis/b-main-lurk-smoke.mp4", "cues": [0.5, 0.9, 6.9]}},
    {"id": "anubis-rugs-smoke", "map": "anubis", "side": "CT", "type": "smoke", "src": "anubis-fn1", "t": 307, "title": "Rugs smoke", "from": "A side room with arches", "to": "Rugs", "chips": ["Crouch throw"], "steps": ["Crouch in the room with the arched windows (Stand).", "Aim at the upper left part of the arched window (Aim).", "Throw while crouched (Detail).", "The smoke lands on Rugs on the far side (Result)."], "note": "A CT smoke for Rugs that you can throw without leaving cover.", "shots": [["Stand", "img/anubis/rugs-smoke-stand.jpg"], ["Aim", "img/anubis/rugs-smoke-aim.jpg"], ["Detail", "img/anubis/rugs-smoke-detail.jpg"], ["Result", "img/anubis/rugs-smoke-result.jpg"]], "order": 39, "clip": {"file": "clips/anubis/rugs-smoke.mp4", "cues": [0.5, 2.4, 3.3, 4.6]}},
    {"id": "anubis-connector-flash", "map": "anubis", "side": "CT", "type": "flash", "src": "anubis-cn1", "t": 92, "title": "Connector flash", "from": "B site", "to": "Connector", "chips": ["Left-click"], "steps": ["Stand behind the carved stone block next to the painted pillar (Stand).", "Aim just right of the top of the scaffolding, beside the column (Aim).", "Left-click throw, then peek Connector as it pops (Result)."], "note": "A pop flash for peeking Connector. In the clip the CT swings right after it and wins the fight.", "shots": [["Stand", "img/anubis/connector-flash-stand.jpg"], ["Aim", "img/anubis/connector-flash-aim.jpg"], ["Result", "img/anubis/connector-flash-result.jpg"]], "order": 40, "clip": {"file": "clips/anubis/connector-flash.mp4", "cues": [0.5, 2.5, 8.0]}},
    {"id": "anubis-b-solo-flash", "map": "anubis", "side": "CT", "type": "flash", "src": "anubis-fn1", "t": 433, "title": "B solo flash", "from": "B site", "to": "B site", "chips": ["Jump-throw"], "steps": ["Stand next to the painted pillar at B (Stand).", "Turn to the brick wall and aim at the joint between the light stone blocks (Aim).", "Jump-throw. The flash goes up over the wall (Detail).", "Peek as it pops. Players on the site are blinded (Result)."], "note": "A self flash for swinging B site as a CT.", "shots": [["Stand", "img/anubis/b-solo-flash-stand.jpg"], ["Aim", "img/anubis/b-solo-flash-aim.jpg"], ["Detail", "img/anubis/b-solo-flash-detail.jpg"], ["Result", "img/anubis/b-solo-flash-result.jpg"]], "order": 41, "clip": {"file": "clips/anubis/b-solo-flash.mp4", "cues": [0.5, 2.0, 2.8, 9.3]}},
    {"id": "anubis-water-tunnel-flash", "map": "anubis", "side": "CT", "type": "flash", "src": "anubis-cn1", "t": 103, "title": "Water flashbang", "from": "Steps by the water", "to": "Water tunnel", "chips": ["Right-click + jump-throw"], "steps": ["Stand next to the stone steps by the white doorway (Stand).", "Aim at the edge of the step on the floor (Aim).", "Right-click and jump-throw. It pops in the covered water tunnel and blinds Ts inside (Result)."], "note": "Use it before you peek the water. The T in the clip is blinded in the tunnel.", "shots": [["Stand", "img/anubis/water-tunnel-flash-stand.jpg"], ["Aim", "img/anubis/water-tunnel-flash-aim.jpg"], ["Result", "img/anubis/water-tunnel-flash-result.jpg"]], "order": 42, "clip": {"file": "clips/anubis/water-tunnel-flash.mp4", "cues": [0.5, 4.5, 10.9]}},
    {"id": "anubis-mid-solo-flash", "map": "anubis", "side": "CT", "type": "flash", "src": "anubis-fn1", "t": 366, "title": "Mid solo flash", "from": "Mid", "to": "Mid", "chips": ["Walking throw"], "steps": ["Face the wooden door with the ankh carving (Stand).", "Put your crosshair on the left edge of the door frame. The inset shows where to stand (Aim).", "Walk forward and throw, then peek mid as it flies down the lane (Result)."], "note": "A self flash for taking a mid peek as a CT.", "shots": [["Stand", "img/anubis/mid-solo-flash-stand.jpg"], ["Aim", "img/anubis/mid-solo-flash-aim.jpg"], ["Result", "img/anubis/mid-solo-flash-result.jpg"]], "order": 43, "clip": {"file": "clips/anubis/mid-solo-flash.mp4", "cues": [0.4, 1.3, 3.7]}},
    {"id": "anubis-a-push-flash", "map": "anubis", "side": "CT", "type": "flash", "src": "anubis-fn1", "t": 311, "title": "A push support flash", "from": "A side room with arches", "to": "A site", "chips": ["Crouch throw"], "steps": ["Crouch in the room with the arched windows, at the spot shown in the inset (Stand).", "Aim just above the smaller left window (Aim).", "Throw while crouched. It flies out over A (Result)."], "note": "FNScence uses it to support a teammate who pushes out on A.", "shots": [["Stand", "img/anubis/a-push-flash-stand.jpg"], ["Aim", "img/anubis/a-push-flash-aim.jpg"], ["Result", "img/anubis/a-push-flash-result.jpg"]], "order": 44, "clip": {"file": "clips/anubis/a-push-flash.mp4", "cues": [0.3, 1.3, 3.1]}},
    {"id": "anubis-water-doors-flash", "map": "anubis", "side": "CT", "type": "flash", "src": "anubis-fn1", "t": 344, "title": "Water flash", "from": "A side alley", "to": "Water doors", "chips": ["Standing throw"], "steps": ["Stand at the spot shown in the inset, looking down the alley (Stand).", "Aim at the top of the double wooden doors at the end of the alley (Aim).", "Throw while standing still. It pops in the doorway (Result)."], "note": "One of FNScence's new water flashes for the CT side of A.", "shots": [["Stand", "img/anubis/water-doors-flash-stand.jpg"], ["Aim", "img/anubis/water-doors-flash-aim.jpg"], ["Result", "img/anubis/water-doors-flash-result.jpg"]], "order": 45, "clip": {"file": "clips/anubis/water-doors-flash.mp4", "cues": [0.4, 4.4, 6.4]}},
    {"id": "inferno-t-b-boost-smoke", "map": "inferno", "side": "T", "type": "smoke", "src": "inferno-ng", "t": 14, "title": "B boost smoke", "from": "Banana", "to": "CT and boost", "chips": ["Left click"], "steps": ["Stand in the middle of the gas panel on the banana wall (Stand).", "Look up through the arch and aim slightly above the corner of the far building (Aim).", "Left click throw (Detail).", "The smoke lands in front of CT and also covers boost (Result)."], "note": "A quick smoke from banana that blocks CT and the boost spot on B. The narrator says you get it every single time.", "shots": [["Stand", "img/inferno/t-b-boost-smoke-stand.jpg"], ["Aim", "img/inferno/t-b-boost-smoke-aim.jpg"], ["Detail", "img/inferno/t-b-boost-smoke-detail.jpg"], ["Result", "img/inferno/t-b-boost-smoke-result.jpg"]], "order": 46, "clip": {"file": "clips/inferno/t-b-boost-smoke.mp4", "cues": [0.5, 2.5, 6.5, 9.5]}},
    {"id": "inferno-t-coffins-smoke", "map": "inferno", "side": "T", "type": "smoke", "src": "inferno-ng", "t": 53, "title": "Coffins smoke", "from": "Banana", "to": "Coffins", "chips": ["Jump-throw"], "steps": ["Stand against the wall by the red door and the B sign (Stand).", "Aim at the top corner of the wall behind the barrels, just left of the B box (Aim).", "Jump throw with left click (Detail).", "The smoke covers coffins and the side path next to it (Result)."], "note": "Blocks all of coffins and the side area so no one can creep through. Moving a little left or right still covers the same spot.", "shots": [["Stand", "img/inferno/t-coffins-smoke-stand.jpg"], ["Aim", "img/inferno/t-coffins-smoke-aim.jpg"], ["Detail", "img/inferno/t-coffins-smoke-detail.jpg"], ["Result", "img/inferno/t-coffins-smoke-result.jpg"]], "order": 47, "clip": {"file": "clips/inferno/t-coffins-smoke.mp4", "cues": [0.5, 4.5, 7.5, 12.5]}},

    {"id": "inferno-ct-b-anti-push-flash", "map": "inferno", "side": "CT", "type": "flash", "src": "inferno-ml", "t": 98, "title": "B anti-push flash", "from": "B site", "to": "B site", "chips": ["Right click", "Crouch"], "steps": ["Stand by the stone pillar on B site (Stand).", "Crouch by the pallets and aim at the pink bag on the ground (Aim).", "Right click throw. The narrator says jump-throw first and a plain throw in the recap, so check the clip.", "Ts pushing onto site are blinded (Result)."], "note": "For when Ts push B. The flash does not blind you, so you can peek while they turn away from it.", "shots": [["Stand", "img/inferno/ct-b-anti-push-flash-stand.jpg"], ["Aim", "img/inferno/ct-b-anti-push-flash-aim.jpg"], ["Result", "img/inferno/ct-b-anti-push-flash-result.jpg"]], "order": 73, "clip": {"file": "clips/inferno/ct-b-anti-push-flash.mp4", "cues": [0.5, 6.5, 11.5]}},
    {"id": "mirage-window-tspawn", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 15, "title": "Window smoke", "from": "T spawn", "to": "Window", "chips": ["Jump-throw"], "steps": ["Go to the stairs in the corner of T spawn and tuck yourself all the way into the corner (Stand).", "Look at the rug hanging on the red A building. Find the small arch shapes in its pattern and aim at the second one, not the first (Aim, Detail).", "Jump-throw."], "note": "The old trash can lineup no longer works after the map changes. This one bounces on the far side of the window, so it is very hard for CTs to block, and it has some leeway.", "shots": [["Stand", "img/mirage/c-window-stand.jpg"], ["Aim", "img/mirage/c-window-aim.jpg"], ["Detail", "img/mirage/c-window-detail.jpg"], ["Result", "img/mirage/c-window-result.jpg"]], "order": 74, "clip": {"file": "clips/mirage/c-window-tspawn.mp4", "cues": [0.5, 2.5, 5.5, 14.0]}},
    {"id": "mirage-ct-smoke", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 335, "title": "CT smoke", "from": "Palace alley", "to": "CT", "chips": ["Jump-throw"], "steps": ["In palace alley, tuck yourself all the way into the corner (Stand). The inset in Detail shows the spot.", "Aim at the middle of the wooden beam (Aim).", "Jump-throw."], "note": "Lands right on top of the box at CT. Defenders can only see over it if they jump all the way up on top of ticket.", "shots": [["Stand", "img/mirage/c-ctsmoke-stand.jpg"], ["Aim", "img/mirage/c-ctsmoke-aim.jpg"], ["Detail", "img/mirage/c-ctsmoke-detail.jpg"], ["Result", "img/mirage/c-ctsmoke-result.jpg"]], "order": 75, "clip": {"file": "clips/mirage/c-ct-smoke.mp4", "cues": [0.5, 2.0, 3.5, 7.0]}},
    {"id": "mirage-stairs-smoke", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 403, "title": "Stairs smoke", "from": "Palace alley", "to": "Stairs", "chips": ["Middle throw", "Jump-throw"], "steps": ["Jump up on the small ledge in palace alley and follow it around the corner to the wooden beam (Stand). Tuck into the corner, the same spot as the jungle smoke.", "Go straight down from the jungle smoke aim to the cracked bricks, a little down and to the right (Aim). It does not have to be precise.", "Hold left + right click (Middle throw) and jump-throw."], "note": "It bounces off Tetris and lands on the stairs. Pair it with the jungle smoke from the same corner for an A execute.", "shots": [["Stand", "img/mirage/c-stairs-stand.jpg"], ["Aim", "img/mirage/c-stairs-aim.jpg"], ["Result", "img/mirage/c-stairs-result.jpg"]], "order": 76, "clip": {"file": "clips/mirage/c-stairs-smoke.mp4", "cues": [0.5, 2.5, 9.5]}},
    {"id": "mirage-jungle-alley", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 371, "title": "Jungle smoke (palace alley)", "from": "Palace alley", "to": "Jungle", "chips": ["Regular throw"], "steps": ["Jump up on the small ledge in palace alley, run around the corner to the wooden beam and tuck into the corner (Stand).", "Aim at the very top of the wall, at the left corner next to the wooden roof (Aim). Anywhere along that top line works as long as you do not go too far toward the middle.", "Regular throw."], "note": "Blocks the jungle angle on A. It is strongest when you throw it together with the stairs smoke.", "shots": [["Stand", "img/mirage/c-jungle-stand.jpg"], ["Aim", "img/mirage/c-jungle-aim.jpg"], ["Result", "img/mirage/c-jungle-result.jpg"]], "order": 77, "clip": {"file": "clips/mirage/c-jungle-alley.mp4", "cues": [0.5, 2.5, 11.0]}},
    {"id": "mirage-connector-tspawn", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 81, "title": "Connector smoke", "from": "T spawn", "to": "Connector", "chips": ["Jump-throw"], "steps": ["Line up in the corner by the trash can in T spawn (Stand).", "Look at the same rug as the window smoke and put your crosshair on the corner edge of the first little step in its pattern (Aim, Detail).", "Jump-throw."], "note": "It drops onto the second step of connector and blocks all vision. If it lands on the first step or lower, it may not cover the top of connector.", "shots": [["Stand", "img/mirage/c-connector-stand.jpg"], ["Aim", "img/mirage/c-connector-aim.jpg"], ["Detail", "img/mirage/c-connector-detail.jpg"], ["Result", "img/mirage/c-connector-result.jpg"]], "order": 78, "clip": {"file": "clips/mirage/c-connector-tspawn.mp4", "cues": [0.5, 3.0, 4.5, 9.5]}},
    {"id": "mirage-topmid-cross", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 141, "title": "Top mid smoke (cross)", "from": "T spawn", "to": "Top mid", "chips": ["Regular throw"], "steps": ["Line up in the same trash can corner in T spawn (Stand).", "Aim at the very top of the antenna (Aim).", "Regular throw. Do not jump."], "note": "A cross smoke for top mid, thrown from the same spot as the connector and catwalk smokes. It lets your team cross mid.", "shots": [["Stand", "img/mirage/c-topmid-stand.jpg"], ["Aim", "img/mirage/c-topmid-aim.jpg"], ["Result", "img/mirage/c-topmid-result.jpg"]], "order": 79, "clip": {"file": "clips/mirage/c-topmid-cross.mp4", "cues": [0.3, 7.8, 13.3]}},
    {"id": "mirage-short-tspawn", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 115, "title": "Short smoke (catwalk)", "from": "T spawn", "to": "Catwalk", "chips": ["Jump-throw"], "steps": ["Line up in the same trash can corner in T spawn. The inset in Detail shows the spot.", "Look up at the leaves on top of the wall and aim at the edge of the leaf that angles down (Aim).", "Jump-throw."], "note": "It flies over the mid buildings and drops right in front of catwalk with full coverage.", "shots": [["Aim", "img/mirage/c-short-aim.jpg"], ["Detail", "img/mirage/c-short-detail.jpg"], ["Result", "img/mirage/c-short-result.jpg"]], "order": 80, "clip": {"file": "clips/mirage/c-short-tspawn.mp4", "cues": [0.4, 1.9, 12.9]}},
    {"id": "mirage-bshort-smoke", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 218, "title": "Short smoke (B exec)", "from": "Back alley", "to": "Short", "chips": ["Regular throw"], "steps": ["In back alley, tuck into the corner shown in Stand. All three B smokes are thrown from this spot.", "Look up at the tower and aim at the very top of its left edge, not the bottom corner of its roof (Aim, Detail).", "Regular throw. No jump needed."], "note": "Blocks all vision from short (catwalk) onto B. It matters most when you rush out of Apartments, since deeper smokes leave gaps.", "shots": [["Stand", "img/mirage/c-bshort-stand.jpg"], ["Aim", "img/mirage/c-bshort-aim.jpg"], ["Detail", "img/mirage/c-bshort-detail.jpg"], ["Result", "img/mirage/c-bshort-result.jpg"]], "order": 81, "clip": {"file": "clips/mirage/c-bshort-smoke.mp4", "cues": [0.5, 3.0, 4.5, 8.5]}},
    {"id": "mirage-market-window", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 256, "title": "Market window smoke", "from": "Back alley", "to": "Market window", "chips": ["Jump-throw"], "steps": ["Use the same corner in back alley as the B short smoke. The inset in Aim shows it.", "Follow the corner line of the tower up to where it meets the top, and aim there (Aim).", "Jump-throw."], "note": "Drops in front of market window and also covers the walk out of market door. A good pick when you only have one smoke, like on a pistol round.", "shots": [["Aim", "img/mirage/c-mktwin-aim.jpg"], ["Result", "img/mirage/c-mktwin-result.jpg"], ["Site view", "img/mirage/c-mktwin-site.jpg"]], "order": 82, "clip": {"file": "clips/mirage/c-market-window.mp4", "cues": [0.5, 7.0, 13.0]}},
    {"id": "mirage-market-door", "map": "mirage", "side": "T", "type": "smoke", "src": "mirage-tg", "t": 290, "title": "Market door smoke", "from": "Back alley", "to": "Market door", "chips": ["Jump-throw"], "steps": ["Use the same corner in back alley as the other B smokes. The inset in Detail shows it.", "Go diagonally down from the market window aim to the corner of the red building roof, next to the tower (Aim).", "Jump-throw."], "note": "Blocks all of market door, even the corner where other smokes leave a gap. Throw short, market window and market door in that order and they pop one after another as you take B.", "shots": [["Aim", "img/mirage/c-mktdoor-aim.jpg"], ["Detail", "img/mirage/c-mktdoor-detail.jpg"], ["Result", "img/mirage/c-mktdoor-result.jpg"]], "order": 83, "clip": {"file": "clips/mirage/c-market-door.mp4", "cues": [0.5, 2.5, 6.0]}},
    {"id": "mirage-a-flash-lamp", "map": "mirage", "side": "T", "type": "flash", "src": "mirage-tg", "t": 462, "title": "A site flash (lamp)", "from": "Palace alley", "to": "A site", "chips": ["Hard to dodge"], "steps": ["In palace alley, face the door with the metal grill and line up with the middle of the grill (Stand).", "Aim at the very top of the lamp on the wall (Aim).", "Throw as shown in the clip."], "note": "It pops over A with almost no warning and hits nearly every CT angle, even players on ticket.", "shots": [["Stand", "img/mirage/c-aflash-stand.jpg"], ["Aim", "img/mirage/c-aflash-aim.jpg"], ["Enemy view", "img/mirage/c-aflash-result.jpg"]], "order": 84, "clip": {"file": "clips/mirage/c-a-flash-lamp.mp4", "cues": [0.5, 3.3, 13.2]}},
    {"id": "mirage-botcon-ct", "map": "mirage", "side": "CT", "type": "smoke", "src": "mirage-gr", "t": 545, "title": "Bottom connector smoke", "from": "Connector", "to": "Bottom connector", "chips": ["Left-click"], "steps": ["In connector, stand against the wall and look down the hallway toward mid (Stand).", "Look through the far arch and aim at the bottom of the broom handle, where it meets the top of the wall (Aim).", "Left-click throw."], "note": "Lets you work out of connector and peek toward underpass while staying safe from mid.", "shots": [["Stand", "img/mirage/c-botcon-stand.jpg"], ["Aim", "img/mirage/c-botcon-aim.jpg"], ["Result", "img/mirage/c-botcon-result.jpg"]], "order": 85, "clip": {"file": "clips/mirage/c-botcon-ct.mp4", "cues": [0.5, 3.3, 5.3]}},
    {"id": "mirage-ramp-ct", "map": "mirage", "side": "CT", "type": "smoke", "src": "mirage-gr", "t": 611, "title": "Ramp smoke (from ticket)", "from": "Ticket", "to": "A ramp", "chips": ["Left-click"], "steps": ["Stand at ticket next to the wooden crate (Stand). The inset in Aim shows the exact spot.", "Aim just above the crate at the red mark, in the gap left of the tall tower (Aim).", "Left-click throw."], "note": "Smokes off A ramp from the CT side.", "shots": [["Stand", "img/mirage/c-ctramp-stand.jpg"], ["Aim", "img/mirage/c-ctramp-aim.jpg"], ["Result", "img/mirage/c-ctramp-result.jpg"]], "order": 86, "clip": {"file": "clips/mirage/c-ramp-ct.mp4", "cues": [0.5, 6.8, 8.1]}},
    {"id": "mirage-palace-ct", "map": "mirage", "side": "CT", "type": "smoke", "src": "mirage-gr", "t": 626, "title": "Palace smoke (retake)", "from": "Top connector", "to": "Palace", "chips": ["Left-click"], "steps": ["Go to top connector and stand against the wall by the arch (Stand).", "Look through the arch and aim at the part of the roof shown in Aim.", "Left-click throw."], "note": "For a retake of A from top connector. It smokes off palace.", "shots": [["Stand", "img/mirage/c-palace-stand.jpg"], ["Aim", "img/mirage/c-palace-aim.jpg"], ["Result", "img/mirage/c-palace-result.jpg"]], "order": 87, "clip": {"file": "clips/mirage/c-palace-ct.mp4", "cues": [0.6, 5.6, 7.1]}},
    {"id": "mirage-apps-ct", "map": "mirage", "side": "CT", "type": "smoke", "src": "mirage-gr", "t": 683, "title": "Apps smoke (upper B)", "from": "B site", "to": "B Apartments", "chips": ["Run + left-click"], "steps": ["Stand on B site against the wall next to the van (Stand). The inset in Aim shows the spot.", "Aim at the part of the Apartments door shown in Aim.", "Run forward a little and left-click throw."], "note": "Use it to re-smoke upper B (the Apartments exit) when you are playing on site.", "shots": [["Stand", "img/mirage/c-apps-stand.jpg"], ["Aim", "img/mirage/c-apps-aim.jpg"], ["Result", "img/mirage/c-apps-result.jpg"]], "order": 88, "clip": {"file": "clips/mirage/c-apps-ct.mp4", "cues": [0.5, 3.5, 6.1]}},
    {"id": "nuke-deep-cross-wall", "map": "nuke", "side": "T", "type": "smoke", "src": "nuke-cn1", "t": 37, "title": "Outside smoke wall", "from": "Outside, behind the truck", "to": "Outside, red to secret", "chips": ["Jump-throw ×2", "Two smokes"], "steps": ["Walk up behind the truck outside and stand against its left side (Stand).", "Aim at the spot shown above the red crate and jump throw the first smoke (Aim).", "Get a second smoke from a teammate. Aim at the red crate as shown and jump throw again (Aim 2).", "The two smokes land side by side and wall off outside (Result)."], "note": "Two smokes from one spot build a wall so your team can cross from red down to secret. A teammate has to drop you the second smoke.", "shots": [["Stand", "img/nuke/deep-cross-wall-stand.jpg"], ["Aim", "img/nuke/deep-cross-wall-aim.jpg"], ["Aim 2", "img/nuke/deep-cross-wall-detail.jpg"], ["Result", "img/nuke/deep-cross-wall-result.jpg"]], "order": 89, "clip": {"file": "clips/nuke/deep-cross-wall.mp4", "cues": [0.5, 3.2, 6.5, 12.5]}},
    {"id": "nuke-main-smoke", "map": "nuke", "side": "T", "type": "smoke", "src": "nuke-cn1", "t": 56, "title": "Main smoke", "from": "Outside, pebble wall corner", "to": "Main door", "chips": ["Jump-throw"], "steps": ["Stand in the corner against the pebble wall, with the truck ahead of you (Stand).", "Aim at the spot shown on the building and jump throw (Aim).", "The smoke lands in front of main and bleeds into the doorway (Result, Inside view)."], "note": "Covers the main door so CTs there cannot watch outside. It is part of the full outside smoke set.", "shots": [["Stand", "img/nuke/main-smoke-stand.jpg"], ["Aim", "img/nuke/main-smoke-aim.jpg"], ["Result", "img/nuke/main-smoke-result.jpg"], ["Inside view", "img/nuke/main-smoke-detail.jpg"]], "order": 90, "clip": {"file": "clips/nuke/main-smoke.mp4", "cues": [0.4, 1.9, 10.4, 13.4]}},
    {"id": "nuke-red-cross", "map": "nuke", "side": "T", "type": "smoke", "src": "nuke-ct1", "t": 50, "title": "Red cross smoke", "from": "Outside, along the fence", "to": "Outside, in front of red", "chips": ["Run throw"], "steps": ["Walk past the blue container and stand next to the fence on your right (Stand).", "Aim at the left side of the tall pole in the distance (Aim).", "Run throw. The smoke covers the open ground in front of red (Result)."], "note": "Smokes off the path from far left to far right so you can cross over to red without being spotted.", "shots": [["Stand", "img/nuke/red-cross-stand.jpg"], ["Aim", "img/nuke/red-cross-aim.jpg"], ["Result", "img/nuke/red-cross-result.jpg"]], "order": 91, "clip": {"file": "clips/nuke/red-cross.mp4", "cues": [0.5, 1.7, 7.2]}},
    {"id": "nuke-garage-smoke", "map": "nuke", "side": "T", "type": "smoke", "src": "nuke-cn1", "t": 111, "title": "Garage smoke", "from": "Outside, corner by the notice sign", "to": "Garage door", "chips": ["Jump-throw"], "steps": ["Stand in the corner by the wall with the notice sign (Stand).", "Aim at the spot shown next to the yellow ladder and jump throw (Aim).", "The smoke lands in the garage door (Result)."], "note": "Blocks the garage door so CTs cannot peek outside from garage.", "shots": [["Stand", "img/nuke/garage-smoke-stand.jpg"], ["Aim", "img/nuke/garage-smoke-aim.jpg"], ["Result", "img/nuke/garage-smoke-result.jpg"]], "order": 92, "clip": {"file": "clips/nuke/garage-smoke.mp4", "cues": [0.5, 3.0, 12.5]}},
    {"id": "nuke-outer-heaven", "map": "nuke", "side": "T", "type": "smoke", "src": "nuke-cn1", "t": 126, "title": "Heaven smoke (outer)", "from": "Outside, concrete wall", "to": "Outer heaven", "chips": ["W + jump-throw"], "steps": ["Stand tight against the concrete wall outside, facing the garage (Stand).", "Aim at the top of the yellow ladder as shown (Aim).", "Hold W and jump throw. The smoke spills down over the outside part of heaven (Result)."], "note": "Covers the outside part of heaven. CTs can still drop back behind it, so pair it with other smokes.", "shots": [["Stand", "img/nuke/outer-heaven-stand.jpg"], ["Aim", "img/nuke/outer-heaven-aim.jpg"], ["Result", "img/nuke/outer-heaven-result.jpg"]], "order": 93, "clip": {"file": "clips/nuke/outer-heaven.mp4", "cues": [0.5, 2.8, 11.5]}},
    {"id": "nuke-deep-heaven", "map": "nuke", "side": "T", "type": "smoke", "src": "nuke-cn1", "t": 141, "title": "Deep heaven smoke", "from": "Roof, after the ladder", "to": "Inside heaven", "chips": ["Run + jump-throw"], "steps": ["Climb the ladder to the roof and stand at the spot shown (Stand).", "Aim at the spot shown on the building. Run and jump throw (Aim).", "The smoke flies through the heaven door (Detail) and blooms inside heaven (Result)."], "note": "Smokes heaven from the inside so CTs up there cannot hold the site.", "shots": [["Stand", "img/nuke/deep-heaven-stand.jpg"], ["Aim", "img/nuke/deep-heaven-aim.jpg"], ["Detail", "img/nuke/deep-heaven-detail.jpg"], ["Result", "img/nuke/deep-heaven-result.jpg"]], "order": 94, "clip": {"file": "clips/nuke/deep-heaven.mp4", "cues": [0.5, 1.2, 10.4, 13.4]}},
    {"id": "nuke-lockers-smoke", "map": "nuke", "side": "T", "type": "smoke", "src": "nuke-cn1", "t": 0, "title": "Lockers smoke", "from": "Outside, fence by the pole", "to": "Lockers", "chips": ["Run + jump-throw"], "steps": ["Stand at the fence next to the pole (Stand).", "Aim at the spot shown above the containers. Run and jump throw (Aim).", "The smoke lands deep at the lockers entrance (Result)."], "note": "A deep lockers smoke. The throw spot is exposed, so throw it when teammates are covering you.", "shots": [["Stand", "img/nuke/lockers-smoke-stand.jpg"], ["Aim", "img/nuke/lockers-smoke-aim.jpg"], ["Result", "img/nuke/lockers-smoke-result.jpg"]], "order": 95, "clip": {"file": "clips/nuke/lockers-smoke.mp4", "cues": [0.3, 4.0, 13.3]}},
    {"id": "nuke-vent-lurk", "map": "nuke", "side": "T", "type": "smoke", "src": "nuke-ct1", "t": 392, "title": "Vent lurk smoke", "from": "Outside, fence corner", "to": "A site, near vent", "chips": ["Jump-throw"], "steps": ["Stand in the corner where the fence meets the wall (Stand).", "Look at the garage wall, count three panels over and aim a little higher (Aim).", "Jump throw. The smoke drops down into A site (Result)."], "note": "Break the roof glass first. The smoke lets you slip down vent without being seen from the back of site.", "shots": [["Stand", "img/nuke/vent-lurk-stand.jpg"], ["Aim", "img/nuke/vent-lurk-aim.jpg"], ["Result", "img/nuke/vent-lurk-result.jpg"]], "order": 96, "clip": {"file": "clips/nuke/vent-lurk.mp4", "cues": [0.5, 3.2, 12.5]}},
    {"id": "nuke-ramp-lurk", "map": "nuke", "side": "T", "type": "smoke", "src": "nuke-ct1", "t": 576, "title": "Ramp lurk smoke", "from": "Lobby, door frame", "to": "Ramp room", "chips": ["Left-click"], "steps": ["Stand against the right side of the door frame in lobby (Stand).", "Aim at the top right of the angled part of the wall (Aim).", "Left click throw. The smoke pops out in the ramp room (Result)."], "note": "Lets you move up and take fights on ramp without being exposed to the deep angles.", "shots": [["Stand", "img/nuke/ramp-lurk-stand.jpg"], ["Aim", "img/nuke/ramp-lurk-aim.jpg"], ["Result", "img/nuke/ramp-lurk-result.jpg"]], "order": 97, "clip": {"file": "clips/nuke/ramp-lurk.mp4", "cues": [0.5, 3.5, 12.2]}},
    {"id": "nuke-roof-hut-flash", "map": "nuke", "side": "T", "type": "flash", "src": "nuke-ct2", "t": 37, "title": "Hut flash from roof", "from": "Roof, next to the metal vent", "to": "A site, behind silo", "chips": ["Jump-throw"], "steps": ["Break the two roof windows. Stand next to the metal vent on the roof (Stand).", "Aim into the gap just above the railing (Aim).", "Jump throw. It pops behind the silo as your team comes out of hut (Result)."], "note": "The most common A site flash on Nuke. It blinds the rafters without blinding teammates coming out of hut.", "shots": [["Stand", "img/nuke/roof-hut-flash-stand.jpg"], ["Aim", "img/nuke/roof-hut-flash-aim.jpg"], ["Result", "img/nuke/roof-hut-flash-result.jpg"]], "order": 98, "clip": {"file": "clips/nuke/roof-hut-flash.mp4", "cues": [0.3, 4.3, 13.0]}},
    {"id": "nuke-ramp-flash", "map": "nuke", "side": "T", "type": "flash", "src": "nuke-ct2", "t": 371, "title": "Ramp flash", "from": "Lobby, left of the door frame", "to": "Ramp, behind the red box", "chips": ["Left-click", "Pair with smoke"], "steps": ["Stand on the left side of the door frame in lobby (Stand).", "Aim at the ceiling light as shown (Aim).", "Left click throw. It pops behind the red box on ramp (Result)."], "note": "The most common ramp flash at the pro level. It does not blind teammates running out, and it pairs well with a ramp smoke.", "shots": [["Stand", "img/nuke/ramp-flash-stand.jpg"], ["Aim", "img/nuke/ramp-flash-aim.jpg"], ["Result", "img/nuke/ramp-flash-result.jpg"]], "order": 99, "clip": {"file": "clips/nuke/ramp-flash.mp4", "cues": [0.5, 4.4, 10.5]}},
    {"id": "nuke-roof-vent-flash", "map": "nuke", "side": "T", "type": "flash", "src": "nuke-ct2", "t": 87, "title": "Rafters flash from roof vent", "from": "Roof, on the small vent", "to": "Rafters and back site", "chips": ["Jump-throw"], "steps": ["Jump on top of the small vent on the roof (Stand).", "Stand up and aim at the spot shown, left of the stairs (Aim).", "Jump throw. It pops high over the site (Enemy view)."], "note": "A higher version of the roof flash. Players in the rafters and at back site get fully blinded.", "shots": [["Stand", "img/nuke/roof-vent-flash-stand.jpg"], ["Aim", "img/nuke/roof-vent-flash-aim.jpg"], ["Enemy view", "img/nuke/roof-vent-flash-result.jpg"]], "order": 100, "clip": {"file": "clips/nuke/roof-vent-flash.mp4", "cues": [0.5, 1.2, 13.1]}},

    {"id": "nuke-glaive-smoke", "map": "nuke", "side": "CT", "type": "smoke", "src": "nuke-ct1", "t": 610, "title": "Glaive smoke", "from": "Outside, behind the grey container", "to": "Outside, between main and red", "chips": ["Bounces off the box"], "steps": ["Stand behind the grey container outside (Stand).", "Aim at the box as shown (Aim). Throw as shown in the clip.", "The smoke bounces off the box and covers the area between main and red (Result)."], "note": "A famous CT smoke for outside. It lets you cross to red or take aggressive fights without being spotted.", "shots": [["Stand", "img/nuke/glaive-smoke-stand.jpg"], ["Aim", "img/nuke/glaive-smoke-aim.jpg"], ["Result", "img/nuke/glaive-smoke-result.jpg"]], "order": 104, "clip": {"file": "clips/nuke/glaive-smoke.mp4", "cues": [0.5, 3.0, 7.8]}},
