    {"id": "overpass-t-b-site-flash", "map": "overpass", "side": "T", "type": "flash", "src": "overpass-cst", "t": 358, "title": "B site flash", "from": "Water corner", "to": "B site", "chips": ["Jump-throw"], "steps": ["Get into the corner by the railing on the water side (Stand).", "Aim down from the top of the railing to the spot shown, near the post (Aim).", "Jump-throw.", "The flash pops on the far side of the fence, in front of the B site positions (Result)."], "note": "Use it after taking water to flash teammates onto B site. It does not blind teammates, but it misses a player back toward ramp.", "shots": [["Stand", "img/overpass/t-b-site-flash-stand.jpg"], ["Aim", "img/overpass/t-b-site-flash-aim.jpg"], ["Result", "img/overpass/t-b-site-flash-result.jpg"]], "order": 126, "clip": {"file": "clips/overpass/t-b-site-flash.mp4", "cues": [0.5, 6.0, 12.0]}},
    {"id": "overpass-t-long-site-flash", "map": "overpass", "side": "T", "type": "flash", "src": "overpass-cst", "t": 84, "title": "Long A support flash", "from": "Long A", "to": "A site", "chips": ["Left click"], "steps": ["Stand against the wall with the red A arrow on long A (Stand).", "Aim at the leaves of the tree, left of the tall building, as shown (Aim).", "Throw with a left click.", "From A site, the flash comes over the Biergarten gate (Result)."], "note": "Throw it as you push up long with teammates. It blinds the A site positions without blinding your team, and two can be thrown back to back.", "shots": [["Stand", "img/overpass/t-long-site-flash-stand.jpg"], ["Aim", "img/overpass/t-long-site-flash-aim.jpg"], ["Result", "img/overpass/t-long-site-flash-result.jpg"]], "order": 127, "clip": {"file": "clips/overpass/t-long-site-flash.mp4", "cues": [0.5, 4.8, 8.0]}},
    {"id": "overpass-ct-monster-smoke-banana", "map": "overpass", "side": "CT", "type": "smoke", "src": "overpass-dlgct", "t": 158, "title": "Monster smoke", "from": "Banana", "to": "Monster", "chips": ["Jump-throw"], "steps": ["Stand next to the metal vent box by the wall with the orange arrow (Stand).", "Aim at the bottom of the fence, on the ring shown (Aim).", "Left click jump-throw.", "The smoke fills the monster pipe (Result)."], "note": "Blocks the monster pipe from the banana side. The guide pairs it with a shortpipe molly as fake B site activity.", "shots": [["Stand", "img/overpass/ct-monster-smoke-banana-stand.jpg"], ["Aim", "img/overpass/ct-monster-smoke-banana-aim.jpg"], ["Result", "img/overpass/ct-monster-smoke-banana-result.jpg"]], "order": 128, "clip": {"file": "clips/overpass/ct-monster-smoke-banana.mp4", "cues": [0.5, 2.0, 7.5]}},
    {"id": "overpass-ct-monster-deep-smoke", "map": "overpass", "side": "CT", "type": "smoke", "src": "overpass-dlgct", "t": 177, "title": "Deep monster smoke", "from": "Behind the dumpster", "to": "Monster exit", "chips": ["Jump-throw"], "steps": ["Stand behind the green dumpster, with the truck in front of you (Stand).", "Aim at the insulator on the power line, as shown (Aim).", "Left click jump-throw.", "The smoke lands at the monster exit by the stairs (Result)."], "note": "A deeper monster smoke that blocks the exit stairs instead of the pipe.", "shots": [["Stand", "img/overpass/ct-monster-deep-smoke-stand.jpg"], ["Aim", "img/overpass/ct-monster-deep-smoke-aim.jpg"], ["Result", "img/overpass/ct-monster-deep-smoke-result.jpg"]], "order": 129, "clip": {"file": "clips/overpass/ct-monster-deep-smoke.mp4", "cues": [0.5, 3.0, 8.5]}},
    {"id": "overpass-ct-deep-fountain-smoke", "map": "overpass", "side": "CT", "type": "smoke", "src": "overpass-dlgct", "t": 1, "title": "Deep fountain smoke", "from": "CT spawn", "to": "Fountain", "chips": ["W + jump-throw"], "steps": ["Stand by the wall with the orange A, next to the truck in CT spawn (Stand).", "Aim at the corner of the roof, as shown (Aim).", "Hold W and jump-throw.", "The smoke lands deep, behind the wall at fountain (Result)."], "note": "Thrown straight from CT spawn, so you can use it right as the round starts.", "shots": [["Stand", "img/overpass/ct-deep-fountain-smoke-stand.jpg"], ["Aim", "img/overpass/ct-deep-fountain-smoke-aim.jpg"], ["Result", "img/overpass/ct-deep-fountain-smoke-result.jpg"]], "order": 130, "clip": {"file": "clips/overpass/ct-deep-fountain-smoke.mp4", "cues": [0.5, 1.4, 5.4]}},
    {"id": "overpass-ct-playground-smoke", "map": "overpass", "side": "CT", "type": "smoke", "src": "overpass-dlgct", "t": 9, "title": "Playground exit smoke", "from": "Concrete pillar", "to": "Playground exit", "chips": ["Jump-throw"], "steps": ["Stand at the concrete pillar next to the drain grate (Stand).", "Aim at the pole of the umbrella on the balcony (Aim).", "Left click jump-throw.", "The smoke covers the playground exit by the green sign (Result)."], "note": "Blocks the playground exit. It is the second smoke in the guide, after the deep fountain smoke.", "shots": [["Stand", "img/overpass/ct-playground-smoke-stand.jpg"], ["Aim", "img/overpass/ct-playground-smoke-aim.jpg"], ["Result", "img/overpass/ct-playground-smoke-result.jpg"]], "order": 131, "clip": {"file": "clips/overpass/ct-playground-smoke.mp4", "cues": [0.5, 2.0, 6.0]}},
    {"id": "overpass-ct-long-a-smoke", "map": "overpass", "side": "CT", "type": "smoke", "src": "overpass-dlgct", "t": 101, "title": "Long A smoke (retake)", "from": "Below A site", "to": "Long A entrance", "chips": ["Left click"], "steps": ["Stand at the bottom of the stairs, by the brick wall and the blue bins (Stand).", "Look up and aim at the top rail of the balcony, as shown (Aim).", "Throw with a standing left click.", "The smoke blocks the Biergarten gate at the end of long A (Result)."], "note": "One of the guide's A site retake nades. It cuts off long A while you retake.", "shots": [["Stand", "img/overpass/ct-long-a-smoke-stand.jpg"], ["Aim", "img/overpass/ct-long-a-smoke-aim.jpg"], ["Result", "img/overpass/ct-long-a-smoke-result.jpg"]], "order": 132, "clip": {"file": "clips/overpass/ct-long-a-smoke.mp4", "cues": [0.5, 2.2, 5.5]}},
    {"id": "overpass-ct-monster-flash", "map": "overpass", "side": "CT", "type": "flash", "src": "overpass-cst", "t": 446, "title": "Monster check flash", "from": "B site plank", "to": "Monster", "chips": ["Middle throw"], "steps": ["Stand alongside the wooden plank on B site, near the B pillar (Stand).", "Aim at the underside of the bridge beam, as shown (Aim).", "Middle throw (left + right click).", "Ts inside the monster pipe get blinded (Result)."], "note": "Lets a teammate check the monster pipe. You can also back up into cover and throw the same lineup.", "shots": [["Stand", "img/overpass/ct-monster-flash-stand.jpg"], ["Aim", "img/overpass/ct-monster-flash-aim.jpg"], ["Result", "img/overpass/ct-monster-flash-result.jpg"]], "order": 133, "clip": {"file": "clips/overpass/ct-monster-flash.mp4", "cues": [0.5, 2.5, 10.2]}},
    {"id": "overpass-ct-fountain-flash", "map": "overpass", "side": "CT", "type": "flash", "src": "overpass-cst", "t": 142, "title": "Fountain flash", "from": "By the WC building", "to": "Fountain", "chips": [], "steps": ["Stand alongside the divider with the bench, facing the building with the WC sign (Stand).", "Aim at the top of the stairs, a little right of the middle (Aim).", "Throw as shown in the clip.", "Players behind fountain get fully blinded (Result)."], "note": "Teammates can peek fountain off the back of it. It pops in the bushes and does not blind them.", "shots": [["Stand", "img/overpass/ct-fountain-flash-stand.jpg"], ["Aim", "img/overpass/ct-fountain-flash-aim.jpg"], ["Result", "img/overpass/ct-fountain-flash-result.jpg"]], "order": 134, "clip": {"file": "clips/overpass/ct-fountain-flash.mp4", "cues": [0.5, 4.5, 10.5]}},
    {"id": "overpass-ct-bank-flash", "map": "overpass", "side": "CT", "type": "flash", "src": "overpass-cst", "t": 47, "title": "Long A flash from bank", "from": "Bank", "to": "Long A", "chips": ["Right click"], "steps": ["Go into the corner behind the armored truck (Stand).", "Aim at the spot on the electrical wire, as shown (Aim).", "Throw with a right click.", "Ts coming up long are fully blinded (Result)."], "note": "Use it when you spot Ts moving up long. Peek off the back of it for an easy kill.", "shots": [["Stand", "img/overpass/ct-bank-flash-stand.jpg"], ["Aim", "img/overpass/ct-bank-flash-aim.jpg"], ["Result", "img/overpass/ct-bank-flash-result.jpg"]], "order": 135, "clip": {"file": "clips/overpass/ct-bank-flash.mp4", "cues": [0.5, 3.2, 10.0]}},
    {"id": "overpass-ct-water-flash", "map": "overpass", "side": "CT", "type": "flash", "src": "overpass-cst", "t": 404, "title": "Water check flash", "from": "B site plank", "to": "Water", "chips": ["Left click"], "steps": ["Stand alongside the wooden plank with the orange mesh on B site (Stand).", "Aim just right of the middle of the crane, as shown (Aim).", "Throw with a left click.", "Your teammate peeks water right after it pops (Result)."], "note": "Pops on the other side of the plank so a teammate can check water without getting blinded.", "shots": [["Stand", "img/overpass/ct-water-flash-stand.jpg"], ["Aim", "img/overpass/ct-water-flash-aim.jpg"], ["Result", "img/overpass/ct-water-flash-result.jpg"]], "order": 136, "clip": {"file": "clips/overpass/ct-water-flash.mp4", "cues": [0.5, 4.0, 11.0]}},
    {"id": "train-camera-smoke", "map": "train", "side": "T", "type": "smoke", "src": "train-tg", "t": 63, "title": "Camera smoke", "from": "T spawn (yellow post)", "to": "Camera (A site)", "chips": ["Jump-throw"], "steps": ["Run out of T spawn to the yellow post next to the train. Stand on the side away from the scrape marks on the ground (Stand).", "Aim at the top of the roof, then move left to the metal joint in the pipe (Aim).", "Left click and jump-throw."], "note": "A deep camera smoke that covers the whole entrance and stops at the door. Anyone who walks out of it is already on site.", "shots": [["Stand", "img/train/camera-smoke-stand.jpg"], ["Aim", "img/train/camera-smoke-aim.jpg"], ["Result", "img/train/camera-smoke-result.jpg"]], "order": 137, "clip": {"file": "clips/train/camera-smoke.mp4", "cues": [0.5, 3.0, 10.0]}},
    {"id": "train-connector-smoke", "map": "train", "side": "T", "type": "smoke", "src": "train-tg", "t": 114, "title": "Z (connector) smoke", "from": "T spawn (yellow post)", "to": "Z / connector", "chips": ["Jump-throw"], "steps": ["Line up at the same yellow post as the camera smoke, on the side away from the scrape marks (Stand).", "Aim at the small indent in the wall next to the wooden roof support (Aim).", "Left click and jump-throw."], "note": "Lands behind the door and covers the whole top of connector, which also cuts off the pop dog player. Throw it together with the camera smoke to take A.", "shots": [["Stand", "img/train/connector-smoke-stand.jpg"], ["Aim", "img/train/connector-smoke-aim.jpg"], ["Result", "img/train/connector-smoke-result.jpg"]], "order": 138, "clip": {"file": "clips/train/connector-smoke.mp4", "cues": [0.5, 2.5, 14.0]}},
    {"id": "train-sandwich-smoke", "map": "train", "side": "T", "type": "smoke", "src": "train-tg", "t": 23, "title": "Sandwich smoke", "from": "T spawn (train)", "to": "Sandwich (A site)", "chips": ["Jump-throw"], "steps": ["In T spawn, stand against the train on your left, in the corner at the first door (Stand).", "Look up and aim at the top of the M on the green station sign (Aim).", "Left click and jump-throw. The lineup is forgiving as long as you are on the M."], "note": "Covers the whole sandwich area. A defender can only see over it by jumping on the boxes, where they are easy to spot.", "shots": [["Stand", "img/train/sandwich-smoke-stand.jpg"], ["Aim", "img/train/sandwich-smoke-aim.jpg"], ["Result", "img/train/sandwich-smoke-result.jpg"]], "order": 139, "clip": {"file": "clips/train/sandwich-smoke.mp4", "cues": [0.5, 2.5, 12.5]}},
    {"id": "train-b-sidewalk-smoke", "map": "train", "side": "T", "type": "smoke", "src": "train-tg", "t": 261, "title": "Sidewalk smoke", "from": "B approach (corner by the vent)", "to": "Sidewalk (B site)", "chips": ["Left click"], "steps": ["Take control of the area first, then tuck into the corner against the metal vent (Stand).", "Follow the bottom right point of the red star down to the bricks and aim there (Aim).", "Left click throw."], "note": "Blooms on top of the blue train and covers the B exit, even from players on the boxes. Much safer than a smoke tossed out of B on the run.", "shots": [["Stand", "img/train/b-sidewalk-smoke-stand.jpg"], ["Aim", "img/train/b-sidewalk-smoke-aim.jpg"], ["Result", "img/train/b-sidewalk-smoke-result.jpg"]], "order": 140, "clip": {"file": "clips/train/b-sidewalk-smoke.mp4", "cues": [0.5, 2.5, 10.0]}},
    {"id": "train-b-site-cross-smoke", "map": "train", "side": "T", "type": "smoke", "src": "train-tg", "t": 320, "title": "B site cross smoke", "from": "B approach (second wooden pillar)", "to": "Bomb train (B site)", "chips": ["W tap + throw"], "steps": ["Keep going past the sidewalk spot to the second wooden pillar (Stand).", "Aim at the wire hanging from the ceiling (Aim).", "Tap W for a moment and throw. No full sprint needed, it just adds a little power."], "note": "Lands on top of the bomb train and makes a big smoke that blocks the back of the site, including the oil spot, so you can cross onto B.", "shots": [["Stand", "img/train/b-site-cross-smoke-stand.jpg"], ["Aim", "img/train/b-site-cross-smoke-aim.jpg"], ["Result", "img/train/b-site-cross-smoke-result.jpg"]], "order": 141, "clip": {"file": "clips/train/b-site-cross-smoke.mp4", "cues": [0.5, 2.5, 13.5]}},
    {"id": "train-a-site-flash", "map": "train", "side": "T", "type": "flash", "src": "train-tg", "t": 207, "title": "A site flash", "from": "T spawn exit (pillar)", "to": "A site", "chips": ["Run + jump-throw"], "steps": ["After your smokes, run out of spawn and stop by the pillar. It does not have to be exact (Stand).", "Aim at the edge of the sign (Aim).", "Run until your crosshair meets the small metal piece across the sign, then jump-throw."], "note": "Bounces on the roof and pops over the site. It does not hit your team, but it catches E-box, bomb train and the off angles.", "shots": [["Stand", "img/train/a-site-flash-stand.jpg"], ["Aim", "img/train/a-site-flash-aim.jpg"], ["Result", "img/train/a-site-flash-result.jpg"]], "order": 142, "clip": {"file": "clips/train/a-site-flash.mp4", "cues": [0.5, 2.5, 12.5]}},
    {"id": "train-b-site-flash", "map": "train", "side": "T", "type": "flash", "src": "train-tg", "t": 380, "title": "B site flash", "from": "Second wooden pillar (B)", "to": "Heaven (B site)", "chips": ["Left click"], "steps": ["From the site cross smoke spot, tuck into the corner of the wooden pillar (Stand).", "Aim at the second hanging wire inside the heaven window (Aim).", "Follow the wire up to where it meets the ceiling, then left click throw (Detail)."], "note": "Pops behind the lamp, so it does not blind you as you run onto B. Players waiting in heaven and on the off angles get fully blinded.", "shots": [["Stand", "img/train/b-site-flash-stand.jpg"], ["Aim", "img/train/b-site-flash-aim.jpg"], ["Detail", "img/train/b-site-flash-detail.jpg"], ["Result", "img/train/b-site-flash-result.jpg"]], "order": 143, "clip": {"file": "clips/train/b-site-flash.mp4", "cues": [0.5, 2.5, 3.2, 11.0]}},
    {"id": "train-a-main-flash", "map": "train", "side": "T", "type": "flash", "src": "train-icy", "t": 90, "title": "A main pop flash", "from": "Dumpster near A main", "to": "A main exit", "chips": ["Jump-throw"], "steps": ["Get on top of the yellow dumpster and press into the corner (Stand).", "Aim at the marked spot on the blue metal wall (Aim).", "Jump-throw (Detail)."], "note": "Lands on a railing, so it is safe for your team but blinds anyone looking toward A main. Have a teammate throw it, since the smoke execute leaves no time for flashes.", "shots": [["Stand", "img/train/a-main-flash-stand.jpg"], ["Aim", "img/train/a-main-flash-aim.jpg"], ["Detail", "img/train/a-main-flash-detail.jpg"], ["Result", "img/train/a-main-flash-result.jpg"]], "order": 144, "clip": {"file": "clips/train/a-main-flash.mp4", "cues": [0.5, 2.5, 5.5, 12.5]}},
    {"id": "train-b-heaven-flash", "map": "train", "side": "T", "type": "flash", "src": "train-icy", "t": 282, "title": "B heaven pop flash", "from": "Wooden beam on the B walkway", "to": "Heaven (B site)", "chips": ["Jump-throw"], "steps": ["Stand in the corner at the wooden beam on the walkway (Stand).", "Line up with the bottom right of the window, in the middle of the beam (Aim).", "Jump-throw."], "note": "Lands on the windowsill, so your team barely gets flashed while anyone playing heaven is blinded.", "shots": [["Stand", "img/train/b-heaven-flash-stand.jpg"], ["Aim", "img/train/b-heaven-flash-aim.jpg"], ["Result", "img/train/b-heaven-flash-result.jpg"]], "order": 145, "clip": {"file": "clips/train/b-heaven-flash.mp4", "cues": [0.5, 3.0, 10.0]}},
    {"id": "train-ct-a-main-smoke", "map": "train", "side": "CT", "type": "smoke", "src": "train-tg", "t": 428, "title": "A main smoke", "from": "CT spawn (corner by the stairs)", "to": "A main", "chips": ["Run + jump-throw"], "steps": ["From CT spawn, run to the corner by the stairs and press all the way in (Stand).", "Aim at the peak of the roof (Aim).", "Hold left click, then run and jump-throw with a quick W tap."], "note": "Works from any CT spawn and lands deep in A main, so it is up before the Ts can run out.", "shots": [["Stand", "img/train/ct-a-main-smoke-stand.jpg"], ["Aim", "img/train/ct-a-main-smoke-aim.jpg"], ["Result", "img/train/ct-a-main-smoke-result.jpg"]], "order": 146, "clip": {"file": "clips/train/ct-a-main-smoke.mp4", "cues": [0.5, 2.5, 13.0]}},
    {"id": "train-ct-tcon-spawn-smoke", "map": "train", "side": "CT", "type": "smoke", "src": "train-cst", "t": 459, "title": "T con smoke (spawn 4)", "from": "CT spawn 4 (back spawn)", "to": "T connector (A main exit)", "chips": ["D + jump-throw"], "steps": ["Start on spawn 4, the back CT spawn (Stand).", "Look up at the big brick building and aim between the tip of the arch and the side of the building (Aim).", "Hold D and jump-throw the moment your crosshair reaches the point shown on the wall (Detail)."], "note": "An instant spawn smoke that flies all the way into T con and smokes the doorway before the Ts can get out. It covers the same doorway as the A main smoke.", "shots": [["Stand", "img/train/ct-tcon-spawn-smoke-stand.jpg"], ["Aim", "img/train/ct-tcon-spawn-smoke-aim.jpg"], ["Detail", "img/train/ct-tcon-spawn-smoke-detail.jpg"], ["Result", "img/train/ct-tcon-spawn-smoke-result.jpg"]], "order": 147, "clip": {"file": "clips/train/ct-tcon-spawn-smoke.mp4", "cues": [0.5, 2.0, 10.0, 15.0]}},
    {"id": "train-ct-ivy-smoke", "map": "train", "side": "CT", "type": "smoke", "src": "train-conc", "t": 976, "title": "Ivy smoke", "from": "Ivy (CT end)", "to": "Ivy exit", "chips": ["Run + throw"], "steps": ["Walk to the end of ivy, next to the red container (Stand).", "Put your crosshair on the white square on the far wall (Aim).", "Wait about two seconds after you get there, then run forward and throw (Detail)."], "note": "A start of round smoke for the ivy player. It blocks the end of ivy so Ts cannot slip into the cubby without being seen.", "shots": [["Stand", "img/train/ct-ivy-smoke-stand.jpg"], ["Aim", "img/train/ct-ivy-smoke-aim.jpg"], ["Detail", "img/train/ct-ivy-smoke-detail.jpg"], ["Result", "img/train/ct-ivy-smoke-result.jpg"]], "order": 148, "clip": {"file": "clips/train/ct-ivy-smoke.mp4", "cues": [0.5, 2.0, 6.5, 15.0]}},
    {"id": "train-ct-b-retake-smoke", "map": "train", "side": "CT", "type": "smoke", "src": "train-ezg", "t": 588, "title": "B retake smoke", "from": "Connector exit to B (teal doors)", "to": "B site, behind the train", "chips": ["Left click"], "steps": ["Get into the corner by the teal doors at the B end of connector (Stand).", "Aim at the dark mark on the train, seen through the doorway (Aim).", "Left click throw."], "note": "Gives you space to get out behind the train and back onto B on a retake. From there you can clear upper and take the site back.", "shots": [["Stand", "img/train/ct-b-retake-smoke-stand.jpg"], ["Aim", "img/train/ct-b-retake-smoke-aim.jpg"], ["Result", "img/train/ct-b-retake-smoke-result.jpg"]], "order": 149, "clip": {"file": "clips/train/ct-b-retake-smoke.mp4", "cues": [0.5, 5.0, 13.5]}},
    {"id": "train-deep-a-main-smoke", "map": "train", "side": "CT", "type": "smoke", "src": "train-cs", "t": 611, "title": "Deep A main smoke", "from": "A site (yellow flatcar)", "to": "A main, toward T spawn", "chips": ["Jump-throw"], "steps": ["Stand against the side of the yellow flatcar on A (Stand).", "Aim at the top edge of the flatcar, as shown (Aim).", "Left click and jump-throw."], "note": "Smokes A main off toward T spawn so your team can push. Follow it with the A main push flash from the same spot.", "shots": [["Stand", "img/train/deep-a-main-smoke-stand.jpg"], ["Aim", "img/train/deep-a-main-smoke-aim.jpg"], ["Result", "img/train/deep-a-main-smoke-result.jpg"]], "order": 150, "clip": {"file": "clips/train/deep-a-main-smoke.mp4", "cues": [0.5, 3.0, 8.5]}},

  function render() {
    renderHeader(); renderLive(); renderShelf('smoke'); renderShelf('flash'); renderSource();
    try { history.replaceState(null, '', `#${view.map}/${view.side.toLowerCase()}`); } catch {}
    store.set({ map: view.map, side: view.side });
  }

  // ---------- interactions ----------
  function pick(next, fromUser = true) {
    const changed = (next.map && next.map !== view.map) || (next.side && next.side !== view.side);
    if (next.map) view.map = next.map;
    if (next.side) view.side = next.side;
    if (changed) { view.page = { smoke: 0, flash: 0 }; pinned.clear(); }
    if (fromUser && live.mode === 'on' && live.state && live.state.connected) view.follow = false;
    // A live update that keeps the same map and side only refreshes the header, so the slideshow keeps running.
    if (!changed && !fromUser) { renderHeader(); renderLive(); return; }
    render();
  }
  $('sideT').addEventListener('click', () => pick({ side: 'T' }));
  $('sideCT').addEventListener('click', () => pick({ side: 'CT' }));
  for (const type of ['smoke', 'flash']) {
    $('prev-' + type).addEventListener('click', () => { view.page[type]--; renderShelf(type); });
    $('next-' + type).addEventListener('click', () => { view.page[type]++; renderShelf(type); });
  }

  // ---------- lightbox ----------
  const lb = { l: null, i: 0, clip: false };
  const lbVideo = $('lbVideo');
  function openLightbox(l, i) {
    lb.l = l; lb.i = i; lb.clip = !!(l.clip && !l._noClip);
    $('lbImg').hidden = lb.clip; lbVideo.hidden = !lb.clip;
    if (lb.clip) {
      lbVideo.src = l.clip.file; lbVideo.muted = true; lbVideo.playbackRate = RATES[play.speed];
      lbVideo.addEventListener('loadedmetadata', () => { lbVideo.currentTime = l.clip.cues[i] || 0; lbVideo.play().catch(() => {}); }, { once: true });
    }
    drawLightbox();
    const d = $('lightbox'); if (!d.open) { d.showModal(); $('app').classList.add('lb-open'); }
    for (const c of clips) c.sync();   // pause the cards behind it
  }
  $('lightbox').addEventListener('close', () => {
    $('app').classList.remove('lb-open');
    lbVideo.pause(); lbVideo.removeAttribute('src'); lbVideo.load();
    for (const c of clips) c.sync();
  });
  lbVideo.addEventListener('timeupdate', () => {
    if (!lb.clip) return;
    let i = 0; lb.l.clip.cues.forEach((t, k) => { if (lbVideo.currentTime + 0.05 >= t) i = k; });
    if (i !== lb.i) { lb.i = i; drawLightbox(); }
  });
  function drawLightbox() {
    const [label, src] = lb.l.shots[lb.i];
    if (!lb.clip) { $('lbImg').src = src; $('lbImg').alt = `${lb.l.title}: ${label}`; }
    $('lbTitle').textContent = lb.l.title;
    $('lbStep').textContent = `${lb.i + 1} / ${lb.l.shots.length} · ${label}`;
  }
  function stepLightbox(d) {
    lb.i = (lb.i + d + lb.l.shots.length) % lb.l.shots.length;
    if (lb.clip) { lbVideo.currentTime = lb.l.clip.cues[lb.i]; drawLightbox(); return; }
    drawLightbox();
    const art = document.querySelector(`.card[data-id="${lb.l.id}"]`);
    if (art) setShot(art, lb.l, lb.i); else shotIdx.set(lb.l.id, lb.i);
  }
  $('lbPrev').addEventListener('click', () => stepLightbox(-1));
  $('lbNext').addEventListener('click', () => stepLightbox(1));
  $('lbClose').addEventListener('click', () => $('lightbox').close());
  $('lightbox').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
  $('lightbox').addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') stepLightbox(-1); if (e.key === 'ArrowRight') stepLightbox(1); });

  // ---------- live sync (only works when served by the local companion) ----------
  function syncFromLive() {
    const s = live.state;
    if (view.follow && s && s.connected && s.map) pick({ map: s.map, side: s.side || view.side }, false);
    else render();
  }
  async function connectLive() {
    if (!LIVE_ENABLED) return;
    try {
      const r = await fetch('api/state', { cache: 'no-store' });
      if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) throw new Error('no companion');
      const s = await r.json();
      if (!s || s.nadeguide !== 1) throw new Error('no companion');
      live = { mode: 'on', state: s };
      syncFromLive();
      const es = new EventSource('api/events');
      es.onmessage = (e) => { try { live.state = JSON.parse(e.data); syncFromLive(); } catch {} };
    } catch {
      live = { mode: 'off', state: null };
      renderLive();
    }
  }

  // ---------- boot ----------
  const fromHash = (location.hash || '').replace('#', '').split('/');
  const saved = store.get();
  if (fromHash[0]) { view.map = fromHash[0]; if (fromHash[1]) view.side = fromHash[1].toUpperCase() === 'CT' ? 'CT' : 'T'; }
  else if (saved) { view.map = saved.map || view.map; view.side = saved.side === 'CT' ? 'CT' : 'T'; }
  render();
  renderPlay();
  connectLive();
  // Follow links like #inferno/ct even when only the hash changes (no page reload).
  window.addEventListener('hashchange', () => {
    const [m, s] = (location.hash || '').replace('#', '').split('/');
    if (m) pick({ map: m, side: s && s.toUpperCase() === 'CT' ? 'CT' : 'T' });
  });
})();
</script>
