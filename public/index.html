<title>Nade Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a tactical board. Match readout strip on top, map rail under it,
   then two shelves (Smokes, Flashes) that each hold one page of three lineup slots. */
:root {
  color-scheme: dark;            /* single dark world by choice: it sits next to the game */
  --ground: #15120e;             /* shadowed sandstone */
  --panel: #1f1a14;
  --panel-2: #2a231b;
  --line: #3b3226;
  --text: #efe5d3;
  --muted: #a8997f;
  --t: #e6a23c;                  /* Terrorist ochre */
  --ct: #79aee0;                 /* Counter-Terrorist steel blue */
  --live: #e5534b;
  --on-accent: #17130e;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-12: 0.75rem; --s-14: 0.875rem; --s-16: 1rem; --s-20: 1.25rem; --s-28: 1.75rem; --s-48: 3rem;
  --radius: 6px;
}
.app { --accent: var(--t); --accent-soft: rgba(230, 162, 60, 0.14); }
.app[data-side="CT"] { --accent: var(--ct); --accent-soft: rgba(121, 174, 224, 0.14); }

* { box-sizing: border-box; }
html, body { background: var(--ground); }
body {
  margin: 0; color: var(--text); font-family: var(--font-body); font-size: var(--s-14); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; display: grid; gap: 20px; }

/* ---------- match strip ---------- */
.strip {
  display: grid; grid-template-columns: 1fr auto; gap: 16px 24px; align-items: end;
  padding-bottom: 18px; border-bottom: 1px solid var(--line);
}
.brand {
  grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-family: var(--font-display); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  font-size: var(--s-14); color: var(--muted);
}
.brand b { color: var(--text); font-weight: 700; }
.readout { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; min-width: 0; }
.map-title { display: grid; gap: 2px; min-width: 0; }
.map-title h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
  font-size: clamp(2.25rem, 6vw, var(--s-48)); line-height: 0.95; letter-spacing: 0.02em; text-wrap: balance;
}
.map-title .code { color: var(--muted); font-size: var(--s-12); }

.sides { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.sides button {
  border: 0; background: transparent; cursor: pointer; padding: 8px 16px; min-width: 56px;
  font-family: var(--font-display); font-weight: 700; font-size: var(--s-20); letter-spacing: 0.06em; color: var(--muted);
}
.sides button[data-side="T"][aria-pressed="true"] { background: var(--t); color: var(--on-accent); }
.sides button[data-side="CT"][aria-pressed="true"] { background: var(--ct); color: var(--on-accent); }
.sides button:not([aria-pressed="true"]):hover { color: var(--text); background: var(--panel-2); }

.matchline { color: var(--muted); font-size: var(--s-12); padding-bottom: 6px; }
.matchline strong { color: var(--text); font-weight: 500; }

.live { display: grid; justify-items: end; gap: 6px; text-align: right; }
.live-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); font-size: var(--s-12); font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.live-chip[data-state="live"] { border-color: rgba(229, 83, 75, 0.5); }
.live-chip[data-state="live"] .dot { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
.live-chip[data-state="waiting"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
@keyframes pulse { 50% { opacity: 0.35; } }
.live-note { color: var(--muted); font-size: var(--s-12); max-width: 34ch; }
.live-note a, .live-note button.linkish { color: var(--text); }
button.linkish { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font-size: inherit; }

[hidden] { display: none !important; }
img { max-width: 100%; }

/* ---------- map rail + slideshow controls ---------- */
.railrow { display: flex; gap: 12px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.maps { display: flex; gap: 8px; flex-wrap: wrap; }
.play { display: inline-flex; align-items: center; gap: 8px; }
.play-label { color: var(--muted); font-size: var(--s-12); text-transform: uppercase; letter-spacing: 0.08em; }
.play-btn, .speeds button {
  border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: var(--s-12); color: var(--muted); padding: 6px 10px;
}
.play-btn { border-radius: var(--radius); color: var(--text); min-width: 76px; }
.play-btn:hover { border-color: var(--accent); }
.speeds { display: inline-flex; }
.speeds button { border-radius: 0; margin-left: -1px; }
.speeds button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
.speeds button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.speeds button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); position: relative; }
.speeds button:not([aria-pressed="true"]):hover { color: var(--text); }
.maps button {
  display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer;
  padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: transparent;
  font-family: var(--font-display); font-weight: 600; font-size: var(--s-16); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
}
.maps button .n { font-family: var(--font-mono); font-size: var(--s-12); font-weight: 400; }
.maps button:hover { color: var(--text); border-color: var(--muted); }
.maps button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.maps button[data-empty="true"]:not([aria-pressed="true"]) { opacity: 0.55; }

/* ---------- shelves ---------- */
.shelf { display: grid; gap: 12px; }
.shelf-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.shelf-head h2 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: var(--s-28);
  text-transform: uppercase; letter-spacing: 0.04em; line-height: 1;
}
.kind-mark { width: 12px; height: 12px; border-radius: 2px; background: var(--accent); flex: none; }
.shelf[data-type="flash"] .kind-mark { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); border-radius: 50%; }
.shelf-head .count { color: var(--muted); font-size: var(--s-12); text-transform: uppercase; letter-spacing: 0.08em; }
.pager { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
.pager span { color: var(--muted); font-size: var(--s-12); min-width: 9ch; text-align: center; }
.pager button {
  width: 34px; height: 34px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel);
  cursor: pointer; font-size: var(--s-20); line-height: 1; display: grid; place-items: center;
}
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager button:disabled { opacity: 0.35; cursor: default; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.shot { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #0d0b08; }
.shot button { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
.shot button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.35s ease; }
.shot img.fading { opacity: 0.15; }
.shot-label {
  position: absolute; left: 8px; top: 8px; padding: 2px 7px; border-radius: 3px;
  background: rgba(13, 11, 8, 0.82); color: var(--text); font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase;
  pointer-events: none;
}
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.tabs button {
  flex: 1 1 0; min-width: 0; border: 0; background: transparent; cursor: pointer; padding: 7px 4px;
  font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs button { position: relative; }
/* Slideshow: the bar under the active tab fills over --dur; when it ends the card advances. */
.tabs .bar { position: absolute; left: 0; bottom: -2px; height: 2px; width: 0; background: var(--accent); pointer-events: none; }
.card[data-playing="true"] .tabs button[aria-selected="true"] { border-bottom-color: var(--line); }
.card[data-playing="true"] .tabs button[aria-selected="true"] .bar { animation: fill var(--dur, 5s) linear forwards; }
.card:hover .bar, .card:focus-within .bar, .app.lb-open .bar { animation-play-state: paused !important; }
@keyframes fill { from { width: 0; } to { width: 100%; } }
.tabs .k { font-family: var(--font-mono); margin-right: 4px; opacity: 0.7; }

.card-body { display: grid; gap: 10px; padding: 14px 14px 12px; flex: 1; align-content: start; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: var(--s-20); letter-spacing: 0.02em; line-height: 1.15; text-wrap: balance; }
.route { margin: 0; color: var(--muted); font-size: var(--s-12); text-transform: uppercase; letter-spacing: 0.08em; }
.route .arrow { color: var(--accent); margin: 0 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 2px 8px; border-radius: 3px; border: 1px solid var(--line); font-size: var(--s-12); color: var(--text); background: var(--ground);
}
.chip.mono { color: var(--accent); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; counter-increment: step; }
.steps li::before {
  content: counter(step); font-family: var(--font-mono); font-size: var(--s-12); color: var(--accent);
  border: 1px solid var(--line); border-radius: 3px; height: 20px; display: grid; place-items: center; margin-top: 1px;
}
.note { margin: 0; color: var(--muted); font-size: var(--s-12); border-left: 2px solid var(--line); padding-left: 10px; }
.card-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 10px 14px; border-top: 1px solid var(--line); font-size: var(--s-12); color: var(--muted);
}
.card-foot a { color: var(--text); text-decoration: none; display: inline-flex; gap: 6px; align-items: baseline; }
.card-foot a:hover { color: var(--accent); }
.card-foot a .mono { color: var(--accent); }

.slot {
  display: grid; place-content: center; text-align: center; gap: 6px; min-height: 220px; padding: 20px;
  border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); font-size: var(--s-12);
}
.slot strong { font-family: var(--font-display); font-size: var(--s-16); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); font-weight: 600; }

.banner {
  display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--muted);
}
.banner strong { color: var(--text); }

.source { color: var(--muted); font-size: var(--s-12); border-top: 1px solid var(--line); padding-top: 14px; }
.source a { color: var(--text); }

/* ---------- lightbox ---------- */
dialog.lightbox {
  width: min(1280px, 100vw - 32px); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line);
  border-radius: var(--radius); background: #0d0b08; color: var(--text);
}
dialog.lightbox::backdrop { background: rgba(8, 7, 5, 0.86); }
.lb-img { display: block; width: 100%; height: auto; max-height: calc(100vh - 110px); object-fit: contain; }
.lb-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.lb-bar .lb-title { font-family: var(--font-display); font-weight: 700; font-size: var(--s-16); letter-spacing: 0.04em; text-transform: uppercase; }
.lb-bar .lb-step { color: var(--muted); font-size: var(--s-12); text-transform: uppercase; letter-spacing: 0.08em; }
.lb-bar .spacer { flex: 1; }
.lb-bar button {
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font-size: var(--s-12);
}
.lb-bar button:hover { border-color: var(--accent); }

@media (max-width: 960px) {
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-rows: auto auto 1fr; }
  .card .shot { grid-column: 1; grid-row: 1; }
  .card .tabs { grid-column: 1; grid-row: 2; }
  .card .card-body { grid-column: 2; grid-row: 1 / 3; }
  .card .card-foot { grid-column: 1 / -1; grid-row: 3; align-self: end; }
  .slot { min-height: 120px; }
}
@media (max-width: 640px) {
  .app { padding-inline: 16px; }
  .strip { grid-template-columns: 1fr; }
  .live { justify-items: start; text-align: left; }
  .card { display: flex; }
  .pager { margin-left: 0; width: 100%; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) {
  .live-chip[data-state="live"] .dot { animation: none; }
}
</style>

<div class="app" id="app" data-side="T">
  <header class="strip">
    <div class="brand"><span><b>Nade Book</b> · smokes &amp; flashes</span><span class="mono" id="steamName"></span></div>
    <div class="readout">
      <div class="map-title">
        <h1 id="mapName">Mirage</h1>
        <span class="code mono" id="mapCode">de_mirage</span>
      </div>
      <div class="sides" role="group" aria-label="Side">
        <button type="button" id="sideT" data-side="T" aria-pressed="true">T</button>
        <button type="button" id="sideCT" data-side="CT" aria-pressed="false">CT</button>
      </div>
      <div class="matchline mono" id="matchline" hidden></div>
    </div>
    <div class="live" id="liveBox" hidden>
      <span class="live-chip" id="liveChip" data-state="manual"><span class="dot"></span><span id="liveText">Manual pick</span></span>
      <span class="live-note" id="liveNote"></span>
    </div>
  </header>

  <div class="railrow">
    <nav class="maps" id="maps" aria-label="Map"></nav>
    <div class="play" role="group" aria-label="Shot slideshow">
      <span class="play-label">Shots</span>
      <button type="button" class="play-btn" id="playBtn" aria-pressed="true">❚❚ Pause</button>
      <div class="speeds" role="group" aria-label="Slideshow speed">
        <button type="button" id="speed-slow" data-speed="slow" aria-pressed="true">Slow</button>
        <button type="button" id="speed-med" data-speed="med" aria-pressed="false">Med</button>
        <button type="button" id="speed-fast" data-speed="fast" aria-pressed="false">Fast</button>
      </div>
    </div>
  </div>

  <div class="banner" id="mapBanner" hidden></div>

  <section class="shelf" data-type="smoke" id="shelf-smoke" aria-labelledby="h-smoke">
    <div class="shelf-head">
      <span class="kind-mark" aria-hidden="true"></span>
      <h2 id="h-smoke">Smokes</h2>
      <span class="count" id="count-smoke"></span>
      <div class="pager">
        <button type="button" id="prev-smoke" aria-label="Previous smokes">‹</button>
        <span class="mono" id="range-smoke" aria-live="polite"></span>
        <button type="button" id="next-smoke" aria-label="Next smokes">›</button>
      </div>
    </div>
    <div class="cards" id="cards-smoke"></div>
  </section>

  <section class="shelf" data-type="flash" id="shelf-flash" aria-labelledby="h-flash">
    <div class="shelf-head">
      <span class="kind-mark" aria-hidden="true"></span>
      <h2 id="h-flash">Flashes</h2>
      <span class="count" id="count-flash"></span>
      <div class="pager">
        <button type="button" id="prev-flash" aria-label="Previous flashes">‹</button>
        <span class="mono" id="range-flash" aria-live="polite"></span>
        <button type="button" id="next-flash" aria-label="Next flashes">›</button>
      </div>
    </div>
    <div class="cards" id="cards-flash"></div>
  </section>

  <p class="source" id="sourceLine"></p>
</div>

<dialog class="lightbox" id="lightbox" aria-label="Lineup screenshot">
  <img class="lb-img" id="lbImg" alt="">
  <div class="lb-bar">
    <span class="lb-title" id="lbTitle"></span>
    <span class="lb-step" id="lbStep"></span>
    <span class="spacer"></span>
    <button type="button" id="lbPrev">‹ Prev</button>
    <button type="button" id="lbNext">Next ›</button>
    <button type="button" id="lbClose">Close</button>
  </div>
</dialog>

  // ---------- view state ----------
  const view = { map: 'mirage', side: 'T', page: { smoke: 0, flash: 0 }, follow: true };
  const shotIdx = new Map();   // lineup id -> selected shot index
  const pinned = new Set();    // lineup ids the viewer stopped on by picking a shot
  const SPEEDS = { slow: 5, med: 3.5, fast: 2 };   // seconds per shot
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const play = (() => {
    try { const p = JSON.parse(localStorage.getItem('nadebook:play') || 'null'); if (p && SPEEDS[p.speed]) return { on: !!p.on, speed: p.speed }; } catch {}
    return { on: !reduceMotion, speed: 'slow' };
  })();
  let live = { mode: 'off', state: null };

  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('nadebook:view') || 'null'); } catch { return null; } },
    set(v) { try { localStorage.setItem('nadebook:view', JSON.stringify(v)); } catch {} },
  };

  function fmtTime(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function mapLabel(slug) { const m = MAPS.find(([k]) => k === slug); return m ? m[1] : slug.charAt(0).toUpperCase() + slug.slice(1); }
  function lineupsFor(map, side, type) { return LINEUPS.filter((l) => l.map === map && l.side === side && l.type === type); }
  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  }

  // ---------- rendering ----------
  function renderHeader() {
    $('app').dataset.side = view.side;
    $('mapName').textContent = mapLabel(view.map);
    $('mapCode').textContent = 'de_' + view.map;
    $('sideT').setAttribute('aria-pressed', String(view.side === 'T'));
    $('sideCT').setAttribute('aria-pressed', String(view.side === 'CT'));

    const maps = $('maps');
    const known = MAPS.map(([k]) => k);
    if (!known.includes(view.map)) MAPS.push([view.map, mapLabel(view.map)]);
    maps.replaceChildren(...MAPS.map(([slug, label]) => {
      const n = LINEUPS.filter((l) => l.map === slug).length;
      return el('button', { type: 'button', 'aria-pressed': String(slug === view.map), 'data-empty': String(n === 0), onclick: () => pick({ map: slug }) },
        label, el('span', { class: 'n', text: n ? String(n) : '0' }));
    }));

    const total = LINEUPS.filter((l) => l.map === view.map).length;
    const banner = $('mapBanner');
    if (total === 0) {
      banner.hidden = false;
      banner.replaceChildren(el('strong', { text: `No ${mapLabel(view.map)} lineups yet.` }),
        el('span', { text: 'Send a lineup video for this map and its smokes and flashes get added here.' }));
    } else banner.hidden = true;
  }

  // Live map/side detection exists only on the copy served by the local companion (it adds this meta tag).
  // Everywhere else (artifact, GitHub Pages) the page is a plain book and never makes a network request for it.
  const LIVE_ENABLED = !!document.querySelector('meta[name="nadebook-live"]');

  function renderLive() {
    $('liveBox').hidden = !LIVE_ENABLED;
    if (!LIVE_ENABLED) return;
    const chip = $('liveChip'), text = $('liveText'), note = $('liveNote'), line = $('matchline');
    const s = live.state;
    note.replaceChildren(); line.hidden = true; $('steamName').textContent = '';
    if (live.mode === 'on' && s && s.connected && s.map) {
      chip.dataset.state = 'live';
      text.textContent = view.follow ? 'Live · following' : 'Live · paused';
      if (s.player) $('steamName').textContent = s.player;
      const bits = [];
      if (s.round) bits.push(el('span', {}, 'Round ', el('strong', { text: String(s.round) })));
      if (s.score) bits.push(el('span', { text: `  ·  CT ${s.score.ct} : ${s.score.t} T` }));
      if (s.phase && s.phase !== 'live') bits.push(el('span', { text: `  ·  ${s.phase}` }));
      line.replaceChildren(...bits); line.hidden = bits.length === 0;
      if (!view.follow) note.append('You picked manually. ', el('button', { class: 'linkish', type: 'button', text: 'Follow the game again', onclick: () => { view.follow = true; syncFromLive(); } }));
      else note.textContent = `Detected ${s.mapName}${s.side ? ' as ' + s.side : ''}.`;
    } else if (live.mode === 'on') {
      chip.dataset.state = 'waiting';
      text.textContent = 'Waiting for CS2';
      note.textContent = s && s.lastSeen ? 'CS2 is in the menu or closed. Join a match to auto-switch map and side.' : 'No data from CS2 yet. Check the GSI cfg is installed on the gaming PC.';
    } else {
      chip.dataset.state = 'manual';
      text.textContent = 'Manual pick';
      note.textContent = 'Pick your map and side. Links like #dust2/ct open straight to a page.';
    }
  }

  function renderShelf(type) {
    const all = lineupsFor(view.map, view.side, type);
    const pages = Math.max(1, Math.ceil(all.length / PER_PAGE));
    view.page[type] = Math.min(view.page[type], pages - 1);
    const start = view.page[type] * PER_PAGE;
    const items = all.slice(start, start + PER_PAGE);
    const noun = type === 'smoke' ? 'smoke' : 'flash';
    const plural = type === 'smoke' ? 'smokes' : 'flashes';

    $('count-' + type).textContent = `${all.length} ${all.length === 1 ? noun : plural} for ${view.side}`;
    $('range-' + type).textContent = all.length ? `${start + 1}–${start + items.length} of ${all.length}` : '0 of 0';
    $('prev-' + type).disabled = view.page[type] === 0;
    $('next-' + type).disabled = view.page[type] >= pages - 1;

    const cards = items.map(card);
    const mapHas = LINEUPS.some((l) => l.map === view.map);
    while (cards.length < PER_PAGE && (all.length > 0 || mapHas)) {
      const first = cards.length === 0;
      cards.push(el('div', { class: 'slot' },
        el('strong', { text: first ? `No ${view.side} ${plural} yet` : 'Open slot' }),
        el('span', { text: first ? `The current source has none for ${mapLabel(view.map)} on ${view.side}. Add another video to fill this page.` : `Room for another ${view.side} ${noun} from the next video.` })));
      if (all.length === 0) break;
    }
    $('cards-' + type).replaceChildren(...cards);
  }

  function card(l) {
    const idx = shotIdx.get(l.id) ?? 0;
    const [label, src] = l.shots[idx];
    const img = el('img', { src, alt: `${l.title}: ${label}`, loading: 'lazy', decoding: 'async', width: '1280', height: '720' });
    const shot = el('div', { class: 'shot' },
      el('button', { type: 'button', 'aria-label': `Open ${l.title} ${label} full size`, onclick: () => openLightbox(l, shotIdx.get(l.id) ?? 0) }, img),
      el('span', { class: 'shot-label', text: label }));
    const tabs = el('div', { class: 'tabs', role: 'tablist', 'aria-label': `${l.title} shots` },
      ...l.shots.map(([lab], i) => el('button', {
        type: 'button', role: 'tab', 'aria-selected': String(i === idx),
        // Picking a shot by hand holds this card there until you press Play again.
        onclick: (e) => { const art = e.currentTarget.closest('.card'); pinned.add(l.id); art.dataset.playing = 'false'; setShot(art, l, i); },
      }, el('span', { class: 'k', text: String(i + 1) }), lab, el('span', { class: 'bar', 'aria-hidden': 'true' }))));
    const chips = el('div', { class: 'chips' }, ...l.chips.map((c) => typeof c === 'string' ? el('span', { class: 'chip', text: c }) : el('span', { class: 'chip mono', text: c.mono })));
    const src0 = SOURCES[l.src];
    for (const [, s] of l.shots) { const pre = new Image(); pre.src = s; }   // warm the cache so the slideshow swaps instantly
    return el('article', { class: 'card', 'data-id': l.id, 'data-playing': String(play.on && !pinned.has(l.id)),
        onanimationend: (e) => { if (e.animationName === 'fill') setShot(e.currentTarget, l, ((shotIdx.get(l.id) ?? 0) + 1) % l.shots.length); } },
      shot, tabs,
      el('div', { class: 'card-body' },
        el('h3', { text: l.title }),
        el('p', { class: 'route' }, l.from, el('span', { class: 'arrow', 'aria-hidden': 'true', text: '→' }), l.to),
        chips,
        el('ol', { class: 'steps' }, ...l.steps.map((s) => el('li', { text: s }))),
        l.note ? el('p', { class: 'note', text: l.note }) : null),
      el('footer', { class: 'card-foot' },
        el('a', { href: `${src0.url}?t=${l.t}`, target: '_blank', rel: 'noopener' }, 'Watch clip ', el('span', { class: 'mono', text: fmtTime(l.t) }), ' ↗'),
        el('span', { text: src0.channel })));
  }

  // Swap a card's visible shot in place: crossfade the image, move the tab highlight.
  function setShot(art, l, i) {
    shotIdx.set(l.id, i);
    const [label, src] = l.shots[i];
    art.querySelector('.shot-label').textContent = label;
    art.querySelector('.shot button').setAttribute('aria-label', `Open ${l.title} ${label} full size`);
    art.querySelectorAll('.tabs button').forEach((b, j) => b.setAttribute('aria-selected', String(j === i)));
    const img = art.querySelector('.shot img');
    const apply = () => { img.src = src; img.alt = `${l.title}: ${label}`; img.classList.remove('fading'); };
    if (reduceMotion) { apply(); return; }
    const tok = (art._tok = (art._tok || 0) + 1);
    img.classList.add('fading');
    const pre = new Image(); pre.src = src;
    const decoded = (pre.decode ? pre.decode() : Promise.resolve()).catch(() => {});
    // Never leave a card dimmed if decoding stalls: swap after 600ms at the latest.
    Promise.race([decoded, new Promise((r) => setTimeout(r, 600))]).then(() => setTimeout(() => { if (art._tok === tok) apply(); }, 180));
  }

  // ---------- slideshow controls ----------
  function renderPlay() {
    $('app').style.setProperty('--dur', SPEEDS[play.speed] + 's');
    const b = $('playBtn');
    b.setAttribute('aria-pressed', String(play.on));
    b.textContent = play.on ? '❚❚ Pause' : '▶ Play';
    for (const k of Object.keys(SPEEDS)) $('speed-' + k).setAttribute('aria-pressed', String(play.speed === k));
    document.querySelectorAll('.card').forEach((c) => { c.dataset.playing = String(play.on && !pinned.has(c.dataset.id)); });
    try { localStorage.setItem('nadebook:play', JSON.stringify(play)); } catch {}
  }
  $('playBtn').addEventListener('click', () => { play.on = !play.on; if (play.on) pinned.clear(); renderPlay(); });
  for (const k of Object.keys(SPEEDS)) $('speed-' + k).addEventListener('click', () => { play.speed = k; if (!play.on) { play.on = true; pinned.clear(); } renderPlay(); });

  function renderSource() {
    const keys = [...new Set(LINEUPS.filter((l) => l.map === view.map).map((l) => l.src))];
    if (!keys.length) { $('sourceLine').textContent = 'Tap a screenshot for full size.'; return; }
    const parts = ['Lineups and screenshots from '];
    keys.forEach((k, i) => {
      const s = SOURCES[k];
      if (i) parts.push(i === keys.length - 1 ? ' and ' : ', ');
      parts.push(el('a', { href: s.url, target: '_blank', rel: 'noopener', text: `${s.channel}, “${s.title}”` }), ` (${s.date})`);
    });
    parts.push('. Tap a screenshot for full size.');
    $('sourceLine').replaceChildren(...parts);
  }

  function render() {
    renderHeader(); renderLive(); renderShelf('smoke'); renderShelf('flash'); renderSource();
    try { history.replaceState(null, '', `#${view.map}/${view.side.toLowerCase()}`); } catch {}
    store.set({ map: view.map, side: view.side });
  }

  // ---------- interactions ----------
  function pick(next, fromUser = true) {
    const changed = (next.map && next.map !== view.map) || (next.side && next.side !== view.side);
    if (next.map) view.map = next.map;
    if (next.side) view.side = next.side;
    if (changed) { view.page = { smoke: 0, flash: 0 }; pinned.clear(); }
    if (fromUser && live.mode === 'on' && live.state && live.state.connected) view.follow = false;
    // A live update that keeps the same map and side only refreshes the header, so the slideshow keeps running.
    if (!changed && !fromUser) { renderHeader(); renderLive(); return; }
    render();
  }
  $('sideT').addEventListener('click', () => pick({ side: 'T' }));
  $('sideCT').addEventListener('click', () => pick({ side: 'CT' }));
  for (const type of ['smoke', 'flash']) {
    $('prev-' + type).addEventListener('click', () => { view.page[type]--; renderShelf(type); });
    $('next-' + type).addEventListener('click', () => { view.page[type]++; renderShelf(type); });
  }

  // ---------- lightbox ----------
  const lb = { l: null, i: 0 };
  function openLightbox(l, i) { lb.l = l; lb.i = i; drawLightbox(); const d = $('lightbox'); if (!d.open) { d.showModal(); $('app').classList.add('lb-open'); } }
  $('lightbox').addEventListener('close', () => $('app').classList.remove('lb-open'));
  function drawLightbox() {
    const [label, src] = lb.l.shots[lb.i];
    $('lbImg').src = src; $('lbImg').alt = `${lb.l.title}: ${label}`;
    $('lbTitle').textContent = lb.l.title;
    $('lbStep').textContent = `${lb.i + 1} / ${lb.l.shots.length} · ${label}`;
  }
  function stepLightbox(d) {
    lb.i = (lb.i + d + lb.l.shots.length) % lb.l.shots.length;
    drawLightbox();
    const art = document.querySelector(`.card[data-id="${lb.l.id}"]`);
    if (art) setShot(art, lb.l, lb.i); else shotIdx.set(lb.l.id, lb.i);
  }
  $('lbPrev').addEventListener('click', () => stepLightbox(-1));
  $('lbNext').addEventListener('click', () => stepLightbox(1));
  $('lbClose').addEventListener('click', () => $('lightbox').close());
  $('lightbox').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
  $('lightbox').addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') stepLightbox(-1); if (e.key === 'ArrowRight') stepLightbox(1); });

  // ---------- live sync (only works when served by the local companion) ----------
  function syncFromLive() {
    const s = live.state;
    if (view.follow && s && s.connected && s.map) pick({ map: s.map, side: s.side || view.side }, false);
    else render();
  }
  async function connectLive() {
    if (!LIVE_ENABLED) return;
    try {
      const r = await fetch('api/state', { cache: 'no-store' });
      if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) throw new Error('no companion');
      const s = await r.json();
      if (!s || s.nadeguide !== 1) throw new Error('no companion');
      live = { mode: 'on', state: s };
      syncFromLive();
      const es = new EventSource('api/events');
      es.onmessage = (e) => { try { live.state = JSON.parse(e.data); syncFromLive(); } catch {} };
    } catch {
      live = { mode: 'off', state: null };
      renderLive();
    }
  }

  // ---------- boot ----------
  const fromHash = (location.hash || '').replace('#', '').split('/');
  const saved = store.get();
  if (fromHash[0]) { view.map = fromHash[0]; if (fromHash[1]) view.side = fromHash[1].toUpperCase() === 'CT' ? 'CT' : 'T'; }
  else if (saved) { view.map = saved.map || view.map; view.side = saved.side === 'CT' ? 'CT' : 'T'; }
  render();
  renderPlay();
  connectLive();
})();
</script>
